function renderReports(mode='monthly'){const d=reportData(mode),b=reportBuckets(mode),mx=Math.max(1,...b.map(x=>x.value));return `<div class="report-filters"><div class="field"><label>Report Period</label><select id="reportMode"><option value="daily" ${mode==='daily'?'selected':''}>Daily</option><option value="weekly" ${mode==='weekly'?'selected':''}>Weekly</option><option value="monthly" ${mode==='monthly'?'selected':''}>Monthly</option><option value="yearly" ${mode==='yearly'?'selected':''}>Yearly</option><option value="all" ${mode==='all'?'selected':''}>All Time</option></select></div><button class="btn btn-primary" onclick="refreshReports()">🔍 Search</button><button class="btn" onclick="exportSalesCsv()">↓ Export CSV</button><button class="btn" onclick="window.print()">▣ Print</button></div><div class="report-kpis"><div class="report-kpi"><div class="report-kpi-label">Sales</div><div class="report-kpi-value">${d.sold}</div></div><div class="report-kpi"><div class="report-kpi-label">Leads</div><div class="report-kpi-value">${d.leads.length}</div></div><div class="report-kpi"><div class="report-kpi-label">Close Rate</div><div class="report-kpi-value">${d.closeRate}%</div></div><div class="report-kpi"><div class="report-kpi-label">Gross Profit</div><div class="report-kpi-value">${money(d.grossProfit)}</div></div><div class="report-kpi"><div class="report-kpi-label">Net Profit</div><div class="report-kpi-value">${money(d.netProfit)}</div></div></div><div class="report-chart"><div class="panel-title">Sales Performance</div><div class="chart-bars">${b.map(x=>`<div class="chart-col" title="${x.value} sale${x.value===1?'':'s'}"><div class="chart-bar" style="height:${Math.max(2,Math.round(x.value/mx*170))}px"></div><div class="chart-label">${esc(x.label)}</div></div>`).join('')}</div></div>${(function(){const g={};d.sales.forEach(s=>{const k=s.dealershipName||'—';if(!g[k])g[k]={count:0,amount:0,gross:0,commission:0};g[k].count++;g[k].amount+=Number(s.saleAmount||0);g[k].gross+=Number(s.grossProfit||0);g[k].commission+=Number(s.commission||0)});const rows=Object.keys(g).sort((a,b)=>g[b].amount-g[a].amount);return `<div class="panel"><div class="panel-head"><div class="panel-title">Sales by Dealership</div></div>${rows.length?`<table class="report-table"><thead><tr><th>Dealership</th><th>Sales</th><th>Revenue</th><th>Gross Profit</th><th>Commission</th></tr></thead><tbody>${rows.map(k=>`<tr><td><strong>${esc(k)}</strong></td><td>${g[k].count}</td><td>${money(g[k].amount)}</td><td>${money(g[k].gross)}</td><td>${moneyCents(g[k].commission||0)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">No sales in this period.</div>`}</div>`})()}${(function(){const rows=d.logged.slice().sort((a,b)=>String(b.saleDate).localeCompare(String(a.saleDate)));const byId={};state.contacts.forEach(c=>byId[c.id]=c);const t0=d.start.getTime(),t1=d.end.getTime();const lost=state.contacts.filter(c=>c.stage==='Dead').map(c=>({c,at:Number(c.lostAt||c._updatedAt||c.createdAt||0)})).filter(x=>x.at>=t0&&x.at<=t1).sort((a,b)=>b.at-a.at);const saleScore=s=>{const n=Number(s.creditScore);return isFinite(n)&&n>0?n:customerCreditScore(byId[s.contactId])};const soldPts=rows.map(s=>({score:saleScore(s),down:customerDownPayment(byId[s.contactId],s)}));const lostPts=lost.map(x=>({score:customerCreditScore(x.c),down:customerDownPayment(x.c)}));const avg=(arr,k)=>{const v=arr.map(p=>p[k]).filter(n=>n!=null);return v.length?{v:v.reduce((a,b)=>a+b,0)/v.length,n:v.length}:null};const allPts=soldPts.concat(lostPts);const A={scoreAll:avg(allPts,'score'),scoreSold:avg(soldPts,'score'),scoreLost:avg(lostPts,'score'),downAll:avg(allPts,'down'),downSold:avg(soldPts,'down'),downLost:avg(lostPts,'down')};const tile=(label,a,fmt,unit)=>`<div class="stat" style="padding:13px"><div class="stat-label">${label}</div><div class="stat-value" style="font-size:24px">${a?fmt(a.v):'—'}</div><div class="stat-note">${a?a.n+' '+unit+(a.n===1?'':'s'):'No data yet'}</div></div>`;const sc=v=>String(Math.round(v));const tiers=['Subprime','Midprime','Prime'];const tc={};tiers.forEach(t=>tc[t]=0);let unt=0,dpSum=0;rows.forEach(s=>{if(tc[s.creditTier]!=null)tc[s.creditTier]++;else unt++;dpSum+=Number(s.downPayment||0)});const avgDp=rows.length?dpSum/rows.length:0;return `<div class="panel"><div class="panel-head"><div><div class="panel-title">Client Breakdown</div><div class="muted" style="font-size:12px;margin-top:4px">Every customer with an outcome in this period — sold and lost/declined — so you can show dealers the quality of all leads, not just buyers</div></div></div><div class="panel-title" style="font-size:14px;margin:0 0 8px">Lead Quality</div><div class="stats" style="margin:0 0 10px;grid-template-columns:repeat(4,minmax(0,1fr))"><div class="stat" style="padding:13px"><div class="stat-label">Sold Customers</div><div class="stat-value" style="font-size:24px">${rows.length}</div><div class="stat-note">Logged sales this period</div></div><div class="stat" style="padding:13px"><div class="stat-label">Lost / Declined</div><div class="stat-value" style="font-size:24px">${lost.length}</div><div class="stat-note">Marked Dead this period</div></div>${tile('Avg Credit Score — All',A.scoreAll,sc,'customer')}${tile('Avg Credit Score — Sold',A.scoreSold,sc,'sale')}</div><div class="stats" style="margin:0 0 14px;grid-template-columns:repeat(4,minmax(0,1fr))">${tile('Avg Credit Score — Lost/Declined',A.scoreLost,sc,'customer')}${tile('Avg Down Payment — All',A.downAll,money,'customer')}${tile('Avg Down Payment — Sold',A.downSold,money,'sale')}${tile('Avg Down Payment — Lost/Declined',A.downLost,money,'customer')}</div><div class="panel-title" style="font-size:14px;margin:6px 0 8px">Sold Customers</div>${rows.length?`<div class="stats" style="margin:0 0 14px;grid-template-columns:repeat(5,minmax(0,1fr))">${tiers.map(t=>`<div class="stat" style="padding:13px"><div class="stat-label">${t}</div><div class="stat-value" style="font-size:24px">${tc[t]}</div><div class="stat-note">${Math.round(tc[t]/rows.length*100)}% of sales</div></div>`).join('')}<div class="stat" style="padding:13px"><div class="stat-label">Avg Down Payment</div><div class="stat-value" style="font-size:24px">${money(avgDp)}</div><div class="stat-note">${money(dpSum)} total</div></div><div class="stat" style="padding:13px"><div class="stat-label">Customers</div><div class="stat-value" style="font-size:24px">${rows.length}</div><div class="stat-note">${unt?unt+' without tier':'All tiered'}</div></div></div><table class="report-table"><thead><tr><th>Customer</th><th>Dealership</th><th>Sale Date</th><th>Vehicle</th><th>Sale Amount</th><th>Down Payment</th><th>Credit Score</th><th>Credit Tier</th></tr></thead><tbody>${rows.map(s=>{const cs=saleScore(s);return `<tr><td><strong>${esc(s.clientName||'')}</strong></td><td>${esc(s.dealershipName||'—')}</td><td>${esc(s.saleDate)}</td><td>${esc(s.vehicle||'')}</td><td>${money(s.saleAmount)}</td><td>${money(s.downPayment)}</td><td>${cs!=null?cs:'—'}</td><td>${esc(s.creditTier||'—')}</td></tr>`}).join('')}</tbody></table>`:`<div class="empty">No logged sales in this period.</div>`}<div class="panel-title" style="font-size:14px;margin:18px 0 8px">Lost / Declined Customers</div>${lost.length?`<table class="report-table"><thead><tr><th>Customer</th><th>Lost Date</th><th>Source</th><th>Vehicle of Interest</th><th>Credit Score</th><th>Down Payment</th></tr></thead><tbody>${lost.map(x=>{const cs=customerCreditScore(x.c),dp=customerDownPayment(x.c);return `<tr><td><strong>${esc(displayName(x.c))}</strong></td><td>${new Date(x.at).toLocaleDateString()}</td><td>${esc(x.c.source||'—')}</td><td>${esc(x.c.vehicle||'')}</td><td>${cs!=null?cs:'—'}</td><td>${dp!=null?money(dp):'—'}</td></tr>`}).join('')}</tbody></table>`:`<div class="empty">No lost/declined customers in this period.</div>`}</div>`})()}<div class="panel"><div class="panel-head"><div class="panel-title">Logged Sales</div></div>${d.sales.length?`<table class="report-table"><thead><tr><th>Date</th><th>Client</th><th>Dealership</th><th>Vehicle</th><th>Sale Amount</th><th>Vehicle Cost</th><th>Gross Profit</th><th>Net Profit</th><th>Down Payment</th></tr></thead><tbody>${d.sales.map(s=>`<tr><td>${esc(s.saleDate)}</td><td>${esc(s.clientName||'')}</td><td>${esc(s.dealershipName||'—')}</td><td>${esc(s.vehicle||'')}</td><td>${money(s.saleAmount)}</td><td>${money(s.cost)}</td><td>${money(s.grossProfit)}</td><td>${money(s.netProfit!=null?s.netProfit:(Number(s.grossProfit||0)-Number(s.cost||0)))}</td><td>${money(s.downPayment)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">No sales logged for this period.</div>`}</div>`}

'[name="'+n+'"]');return el?String(el.value):undefined};const oldAddress=String(c.address||'');const oldCredit={...(c.creditApp||{})};const ci={firstName:gv('ci_firstName'),lastName:gv('ci_lastName'),phone:gv('ci_phone'),email:gv('ci_email'),address:gv('ci_address'),preferredContact:gv('ci_preferredContact'),bestTime:gv('ci_bestTime'),vehicle:gv('ci_vehicle'),bodyStyle:gv('ci_bodyStyle'),interestType:gv('ci_interestType'),condition:gv('ci_condition'),budget:gv('ci_budget'),tradeIn:gv('ci_tradeIn'),stage:gv('ci_stage')};const newPhone=(ci.phone!=null?ci.phone:(c.phone||''));const newEmail=(ci.email!=null?ci.email:(c.email||''));if((newPhone||newEmail)&&identityDuplicate(newPhone,newEmail,c.id)){toast('A customer with that phone or email already exists');return}const oldStage=c.stage;const toDead=ci.stage==='Dead'&&c.stage!=='Dead';let deferLost=false;if(toDead&&customerCreditScore(c)==null){ci.stage=c.stage;deferLost=true}Object.keys(ci).forEach(k=>{if(ci[k]!==undefined)c[k]=ci[k]});if(toDead&&!deferLost)markLost(c,customerCreditScore(c),customerDownPayment(c));c.name=[c.firstName,c.lastName].filter(Boolean).join(' ');const pf={};CREDIT_FIELDS.forEach(([n])=>{const v=gv('prof_'+n);if(v!==undefined)pf[n]=v});if(Object.keys(pf).length){c.creditApp={...(c.creditApp||{}),...pf};c.creditApp.firstName=c.firstName;c.creditApp.lastName=c.lastName;c.creditApp.phone=c.phone;c.creditApp.email=c.email;const app=state.creditApplications.filter(a=>a.contactId===c.id).sort((a,b)=>Number(b.submittedAt||0)-Number(a.submittedAt||0))[0]||null;if(app){app.data={...(app.data||{}),...c.creditApp};app._updatedAt=Date.now()}}const contactAddressChanged=ci.address!==undefined&&String(ci.address)!==oldAddress;const _paf=['currentStreet','currentCity','currentState','zip'];const profileAddressChanged=_paf.some(n=>String(pf[n]??'')!==String(oldCredit[n]??''));if(profileAddressChanged&&!contactAddressChanged){c.address=[pf.currentStreet,pf.currentCity,pf.currentState,pf.zip].filter(v=>String(v|| tton type="button" class="btn" onclick="showClientPane('${c.id}','activity')">📁 Activity</button></div></div><div class="dcard-tabs"><button type="button" class="dcard-tab active" data-tab="view" onclick="showClientPane('${c.id}','view')">👤 Contact Info</button><button type="button" class="dcard-tab" data-tab="profile" onclick="showClientPane('${c.id}','profile')">📋 Profile</button><button type="button" class="dcard-tab" data-tab="activity" onclick="showClientPane('${c.id}','activity')">🗒 Notes & Activity</button><button type="button" class="dcard-tab" data-tab="documents" onclick="showClientPane('${c.id}','documents')">📂 Documents</button></div><div id="clientDetailView" class="dcard-pane"><div class="dcard-cols"><div class="dcard-col"><div class="dcard-box"><div class="dcard-box-title">Contact Details</div>${erow('👤','First Name','ci_firstName',c.firstName)}${erow('👤','Last Name','ci_lastName',c.lastName)}${erow('☎','Phone','ci_phone',c.phone)}${erow('✉','Email','ci_email',c.email)}${erow('⌂','Address','ci_address',c.address)}${esel('◷','Preferred Contact','ci_preferredContact',c.preferredContact,['Phone','Email','Text'])}${erow('◷','Best Time to Contact','ci_bestTime',c.bestTime)}${drow('▤','Date Added',created.toLocaleDateString())}${drow('◷','Last Contact',lastContact)}</div><div class="dcard-box"><div class="dcard-box-title">Vehicle of Interest</div>${erow('🚗','Year / Make / Model','ci_vehicle',c.vehicle)}${erow('▤','Body Style','ci_bodyStyle',c.bodyStyle)}${esel('▤','Interest Type','ci_interestType',c.interestType,['Purchase','Lease'])}${esel('▤','Condition','ci_condition',c.condition,['New','Used','Certified'])}${erow('$','Budget Range','ci_budget',c.budget)}${erow('↺','Trade-In','ci_tradeIn',c.tradeIn)}</div></div><div class="dcard-col"><div class="dcard-box"><div class="dcard-box-title">Pipeline Information</div>${drow('▦','Pipeline',esc(c.stage||'New Lead'))}${esel('▦','Stage','ci_stage',c.stage||'New Lead',STAGES)}${drow('👤','Assigned To',esc(c.assignedT function collectPrefixed(fd,prefix){const out={};for(const [k,v] of fd.entries())if(k.startsWith(prefix))out[k.slice(prefix.length)]=v;return out}

function saveContact(e,id){e.preventDefault();var openId=id;const fd=new FormData(e.target);const phone=fd.has('phone')?(fd.get('phone')||''):(id?(state.contacts.find(x=>x.id===id)?.phone||''):'');const _em=fd.has('email')?(fd.get('email')||''):(id?(state.contacts.find(x=>x.id===id)?.email||''):'');if((phone||_em)&&identityDuplicate(phone,_em,id)){if(e.target.elements.phone){checkPhoneField(e.target.elements.phone,id);e.target.elements.phone.focus()}toast('A customer with that phone or email already exists');return}const existing=id?state.contacts.find(x=>x.id===id):null;const base={firstName:fd.has('firstName')?(fd.get('firstName')||''):(existing?.firstName||''),lastName:fd.has('lastName')?(fd.get('lastName')||''):(existing?.lastName||''),phone:fd.has('phone')?(fd.get('phone')||''):(existing?.phone||''),email:fd.has('email')?(fd.get('email')||''):(existing?.email||''),address:fd.has('address')?(fd.get('address')||''):(existing?.address||''),vehicle:fd.has('vehicle')?(fd.get('vehicle')||''):(existing?.vehicle||''),stage:fd.has('stage')?(fd.get('stage')||'New Lead'):(existing?.stage||'New Lead'),preferredContact:fd.has('preferredContact')?(fd.get('preferredContact')||''):(existing?.preferredContact||''),bestTime:fd.has('bestTime')?(fd.get('bestTime')||''):(existing?.bestTime||''),bodyStyle:fd.has('bodyStyle')?(fd.get('bodyStyle')||''):(existing?.bodyStyle||''),interestType:fd.has('interestType')?(fd.get('interestType')||''):(existing?.interestType||''),condition:fd.has('condition')?(fd.get('condition')||''):(existing?.condition||''),budget:fd.has('budget')?(fd.get('budget')||''):(existing?.budget||''),tradeIn:fd.has('tradeIn')?(fd.get('tradeIn')||''):(existing?.tradeIn||'')};base.name=[base.firstName,base.lastName].filter(Boolean).join(' ');if(id){const c=state.contacts.find(x=>x.id===id);const oldStage=c.stage;Object.assign(c,base);c._updatedAt=Date.now();const cs=collectPrefixed(fd,'cos_');const box=document.getElementById('coSignerBox');c.coSigner=box&&box.dataset.removed==='1'?null:(box&&!box.classList.contains('hidden')&&hasAny(cs)?cs:null);state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:id,text:'Client record updated',at:Date.now()});if(oldStage!==c.stage)state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:id,text:`Moved ${displayName(c)} to ${c.stage}`,at:Date.now()})}else{const idNew=uid();openId=idNew;state.contacts.unshift({id:idNew,...base,notes:'',creditApp:{},coSigner:null,documents:{},createdAt:Date.now(),_updatedAt:Date.now()});state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:idNew,text:'Contact created',at:Date.now()})}save();render();openContactModal(openId);toast(base.stage==='Dead'?'Saved. Contact is not in active pipeline.':'Client saved')}

async function deleteContact(id){if(!isOwner()){return toast('Only the owner can archive a customer');}if(!confirm('Archive this customer? Only the owner can do this, and it removes them for everyone.'))return;const acts=state.activity.filter(a=>a.contactId===id).map(a=>a.id);const sals=(state.sales||[]).filter(s=>s.contactId===id).map(s=>s.id);const apps=(state.creditApplications||[]).filter(a=>a.contactId===id).map(a=>a.id);if(cloudReady()){const archived=await cloudArchiveMany(id,acts,sals,apps);if(!archived){toast('Archive failed. Customer was not removed.');return;}}state.tombstones=state.tombstones||{};state.tombstones[id]=true;[].concat(acts,sals,apps).forEach(function(x){state.tombstones[x]=true});state.contacts=state.contacts.filter(c=>c.id!==id);state.activity=state.activity.filter(a=>a.contactId!==id);state.sales=(state.sales||[]).filter(s=>s.contactId!==id);state.creditApplications=(state.creditApplications||[]).filter(a=>a.contactId!==id);save();closeModal();render();toast('Customer archived')}
