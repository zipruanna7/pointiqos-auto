 if(!s||!Array.isArray(s.contacts))return null;

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));if(applyingCloud||!cloudReady())return;if(cloudTimer)clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,700)}const SYNC_TABLES=[{key:'contacts',table:'auto_contacts',extra:function(r){return{assigned_to:r.assignedTo||null}}},{key:'activity',table:'auto_activity',extra:function(r){return{contact_id:r.contactId||null}}},{key:'creditApplications',table:'auto_credit_apps',extra:function(r){return{contact_id:r.contactId||null}}},{key:'sales',table:'auto_sales',extra:function(r){return{contact_id:r.contactId||null}}},{key:'partners',table:'auto_partners',extra:function(r){return{}}}];let syncSnapshot={};let cloudTimer=null,applyingCloud=false;function cloudReady(){return !!(supabaseClient&&currentUser&&currentUser.id!=='preview')}function isOwner(){return String((currentUser&&currentUser.role)||'').toLowerCase()==='owner'}function hashRec(r){try{var c=Object.assign({},r);delete c._updatedAt;return JSON.stringify(c)}catch(e){return String(Math.random())}}function mergeCollection(local,rows,tomb){var rmap=new Map();(rows||[]).forEach(function(r){rmap.set(r.id,r);if(r.archived)tomb[r.id]=true});var out=[],seen=new Set();(local||[]).forEach(function(cur){if(!cur||!cur.id)return;var id=cur.id;if(tomb[id])return;seen.add(id);var row=rmap.get(id);if(row&&!row.archived){var remote=row.data||{};remote.id=remote.id||id;var ru=+(remote._updatedAt||Date.parse(row.updated_at)||0),lu=+(cur._updatedAt||0);out.push(ru>=lu?remote:cur)}else{out.push(cur)}});(rows||[]).forEach(function(row){if(row.archived||tomb[row.id]||seen.has(row.id))return;var remote=row.data||{};remote.id=remote.id||row.id;out.push(remote)});return out}async function pushKv(key,val){var h=hashRec({v:val});if(syncSnapshot['__kv_'+key]===h)return;try{var res=await supabaseClient.from('auto_kv').upsert({id:key,data:{v:val},updated_at:new Date().toISOString()});if(res.error)console.warn('kv push',res.error.message||res.error);else syncSnapshot['__kv_'+key]=h}catch(e){console.warn('kv push',e)}}async function pullKv(keys){var out={};try{var res=await supabaseClient.from('auto_kv').select('id,data').in('id',keys);if(res.error){console.warn('kv pull',res.error.message||res.error);return out}(res.data||[]).forEach(function(r){out[r.id]=r.data?r.data.v:undefined;syncSnapshot['__kv_'+r.id]=hashRec({v:out[r.id]})})}catch(e){console.warn('kv pull',e)}return out}async function pushCloud(){if(!cloudReady())return;try{for(const cfg of SYNC_TABLES){var arr=state[cfg.key]||[];syncSnapshot[cfg.key]=syncSnapshot[cfg.key]||{};var snap=syncSnapshot[cfg.key];var ups=[];for(const rec of arr){if(!rec||!rec.id)continue;if(state.tombstones&&state.tombstones[rec.id]){delete snap[rec.id];continue;}var h=hashRec(rec);if(snap[rec.id]!==h){if(!rec._updatedAt)rec._updatedAt=Date.now();ups.push(Object.assign({id:rec.id,data:rec,updated_at:new Date(rec._updatedAt).toISOString(),archived:false},cfg.extra(rec)))}}if(ups.length){var res=await supabaseClient.from(cfg.table).upsert(ups);if(res.error)console.warn('push',cfg.table,res.error.message||res.error);else ups.forEach(function(u){snap[u.id]=hashRec(u.data)})}}if(isOwner()){await pushKv('portalUrl',state.portalUrl);await pushKv('settings',state.settings)}}catch(e){console.warn('pushCloud',e)}}async function pullCloud(){if(!cloudReady())return;try{state.tombstones=state.tombstones||{};var changed=false;for(const cfg of SYNC_TABLES){var res=await supabaseClient.from(cfg.table).select('id,data,updated_at,archived');if(res.error){console.warn('pull',cfg.table,res.error.message||res.error);continue}var rows=res.data||[];var before=state[cfg.key]||[];syncSnapshot[cfg.key]=syncSnapshot[cfg.key]||{};var snap=syncSnapshot[cfg.key];rows.forEach(function(row){if(!row||!row.id)return;if(row.archived){state.tombstones[row.id]=true;delete snap[row.id];return}var remote=row.data||{};remote.id=remote.id||row.id;snap[row.id]=hashRec(remote)});var merged=mergeCollection(before,rows,state.tombstones);state[cfg.key]=merged;if(JSON.stringify(before)!==JSON.stringify(merged))changed=true}var kv=await pullKv(['portalUrl','settings']);if('portalUrl' in kv&&kv.portalUrl!==undefined&&kv.portalUrl!==state.portalUrl){state.portalUrl=kv.portalUrl;changed=true}if('settings' in kv&&kv.settings!==undefined&&JSON.stringify(kv.settings)!==JSON.stringify(state.settings)){state.settings=kv.settings;changed=true}if(changed){applyingCloud=true;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));applyingCloud=false;var main=document.getElementById('appMain');if(main&&!main.classList.contains('app-hidden'))render()}}catch(e){console.warn('pullCloud',e)}}async function cloudArchiveMany(contactId,acts,sals,apps){if(!cloudReady())return false;try{const {error}=await supabaseClient.rpc('auto_archive_contact_bundle',{p_contact_id:contactId,p_activity_ids:Array.isArray(acts)?acts:[],p_sale_ids:Array.isArray(sals)?sals:[],p_credit_app_ids:Array.isArray(apps)?apps:[]});if(error)throw error;return true;}catch(e){console.error('cloudArchive failed',e);return false;}}

function saveStandaloneCreditApplication(e,appId=''){e.preventDefault();const fd=new FormData(e.target);const data=collectPrefixed(fd,'app_');const vehicle=data.vehicle||'';delete data.vehicle;const phone=normalizePhone(data.phone);if(!phone){toast('Phone number is required');return}const resolved=resolveContactIdentity(data.phone,data.email,'');if(resolved.conflict){toast('Application blocked: phone and email belong to different customers');return}let existing=resolved.contact;if(appId){const app=state.creditApplications.find(a=>a.id===appId);if(!app)return;const linked=state.contacts.find(c=>c.id===app.contactId);if(!linked)return;const editIdentity=resolveContactIdentity(data.phone,data.email,linked.id);if(editIdentity.conflict||editIdentity.contact){toast('Application blocked: phone or email belongs to another customer');return}const c=linked;Object.assign(c,{firstName:data.firstName,lastName:data.lastName,name:[data.firstName,data.lastName].filter(Boolean).join(' '),phone:data.phone,email:data.email,address:[data.currentStreet,data.currentCity,data.currentState,data.zip].filter(Boolean).join(', '),vehicle:vehicle||c.vehicle,creditApp:{...data}});c._updatedAt=Date.now();app.data={...data};app.isNew=false;app._updatedAt=Date.now();state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:c.id,text:'Credit application updated',at:Date.now()});save();closeModal();render();toast('Credit application saved');return}let c=existing;if(c){c.firstName=c.firstName||data.firstName;c.lastName=c.lastName||data.lastName;c.name=[c.firstName,c.lastName].filter(Boolean).join(' ');c.email=c.email||data.email;c.address=c.address||[data.currentStreet,data.currentCity,data.currentState,data.zip].filter(Boolean).join(', ');c.vehicle=vehicle||c.vehicle;c.creditApp={...data};c._updatedAt=Date.now()}else{const idNew=uid();c={id:idNew,firstName:data.firstName,lastName:data.lastName,name:[data.firstName,data.lastName].filter(Boolean).join(' '),phone:data.phone,email:data.email,address:[data.currentStreet,data.currentCity,data.currentState,data.zip].filter(Boolean).join(', '),vehicle,stage:'New Lead',notes:'',creditApp:{...data},coSigner:null,createdAt:Date.now(),_updatedAt:Date.now()};state.contacts.unshift(c)}state.creditApplications.unshift({id:'app_'+uid(),contactId:c.id,submittedAt:Date.now(),_updatedAt:Date.now(),isNew:true,source:'Manual',data:{...data}});state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:c.id,text:'Credit application received',at:Date.now()});save();closeModal();render();toast(existing?'Application linked to existing client':'New credit application added')}

function receiveWebsiteCreditApplication(payload){if(!payload||typeof payload!=='object')return false;const incoming={};CREDIT_FIELDS.forEach(([n])=>{incoming[n]=String(payload[n]??'').trim()});const phone=normalizePhone(incoming.phone);const email=normalizeEmail(incoming.email);if(!phone&&!email)return false;const resolved=resolveContactIdentity(incoming.phone,incoming.email,'');if(resolved.conflict){console.error('Website application identity conflict',resolved.phoneMatch?.id,resolved.emailMatch?.id);toast('Application blocked: phone and email belong to different customers');return false}const now=Date.now();const mergeNonBlank=function(existing,newData){const out={...(existing||{})};CREDIT_FIELDS.forEach(([n])=>{const value=String(newData[n]??'').trim();if(value!=='')out[n]=value});return out};let c=resolved.contact;if(c){c.creditApp=mergeNonBlank(c.creditApp,incoming);if(incoming.firstName)c.firstName=incoming.firstName;if(incoming.lastName)c.lastName=incoming.lastName;c.name=[c.firstName,c.lastName].filter(Boolean).join(' ');if(incoming.phone)c.phone=incoming.phone;if(incoming.email)c.email=incoming.email;const addressParts=[incoming.currentStreet,incoming.currentCity,incoming.currentState,incoming.zip].filter(v=>String(v||'').trim());if(addressParts.length)c.address=addressParts.join(', ');if(payload.vehicle)c.vehicle=String(payload.vehicle);c._updatedAt=now}else{c={id:uid(),firstName:incoming.firstName,lastName:incoming.lastName,name:[incoming.firstName,incoming.lastName].filter(Boolean).join(' '),phone:incoming.phone,email:incoming.email,address:[incoming.currentStreet,incoming.currentCity,incoming.currentState,incoming.zip].filter(v=>String(v||'').trim()).join(', '),vehicle:String(payload.vehicle||''),stage:'New Lead',notes:'',creditApp:{...incoming},coSigner:null,documents:{},createdAt:now,_updatedAt:now};state.contacts.unshift(c)}let app=state.creditApplications.filter(a=>a.contactId===c.id&&String(a.source||'').toLowerCase()==='website').sort((a,b)=>Number(b.submittedAt||0)-Number(a.submittedAt||0))[0]||null;if(app){app.data=mergeNonBlank(app.data,incoming);app.isNew=true;app.submittedAt=now;app._updatedAt=now}else{state.creditApplications.unshift({id:'app_'+uid(),contactId:c.id,submittedAt:now,_updatedAt:now,isNew:true,source:'Website',data:{...incoming}})}state.activity.unshift({_updatedAt:now,id:uid(),contactId:c.id,text:'Website credit application received',at:now});save();render();return true}

function saveCreditApplication(id){const c=state.contacts.find(x=>x.id===id);if(!c){toast('Contact not found');return}const scope=document.getElementById('modal');const data={};CREDIT_FIELDS.forEach(([n])=>{const el=scope?.querySelector(`[name="credit_${n}"]`);data[n]=el?String(el.value):String(c.creditApp?.[n]||'')});const newPhone=String(data.phone||'').trim();const newEmail=String(data.email||'').trim();if((newPhone||newEmail)&&identityDuplicate(newPhone,newEmail,c.id)){toast('A customer with that phone or email already exists');return}if(data.firstName)c.firstName=data.firstName;if(data.lastName)c.lastName=data.lastName;c.name=[c.firstName,c.lastName].filter(Boolean).join(' ');if(newPhone)c.phone=data.phone;if(data.email)c.email=data.email;const addr=[data.currentStreet,data.currentCity,data.currentState,data.zip].filter(Boolean).join(', ');if(addr)c.address=addr;c.creditApp={...data};const app=state.creditApplications.find(a=>a.contactId===c.id);if(app){app.data={...data};app.isNew=false;app._updatedAt=Date.now();if(!app.submittedAt)app.submittedAt=Date.now()}else{state.creditApplications.unshift({id:'app_'+c.id,contactId:c.id,submittedAt:Date.now(),_updatedAt:Date.now(),isNew:false,source:'Existing Client',data:{...data}})}state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:c.id,text:app?'Credit application updated':'Credit application saved',at:Date.now()});c._updatedAt=Date.now();save();toast('Credit application saved')}

function creditAppValue(c,n){const d=c.creditApp||{};if(n==='firstName')return c.firstName||d.firstName||'';if(n==='lastName')return c.lastName||d.lastName||'';if(n==='phone')return c.phone||d.phone||'';if(n==='email')return c.email||d.email||'';return d[n]||''}function creditAppPlainText(c){const lines=['CREDIT APPLICATION','Customer: '+displayName(c),''];CREDIT_FIELDS.forEach(([n,l])=>{lines.push(l+': '+(creditAppValue(c,n)||''))});return lines.join('\n')}function creditAppPrintHtml(c){const rows=CREDIT_FIELDS.map(([n,l])=>`<tr><td class="k">${esc(l)}</td><td class="v">${esc(creditAppValue(c,n)||'')}</td></tr>`).join('');return `<h1>Credit Application</h1><h2>${esc(displayName(c))}</h2><table>${rows}</table>`}function printCreditApp(id){const c=state.contacts.find(x=>x.id===id);if(!c)return;document.getElementById('modal').classList.add('wide');document.getElementById('modal').innerHTML=`<div class="modal-head"><div><div class="page-kicker">Credit Application</div><div class="modal-title">${esc(displayName(c))}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-actions" style="justify-content:flex-start;margin:0 0 12px"><button class="btn btn-primary" onclick="printCreditAppWindow('${c.id}')">🖨 Print / Save PDF</button><button class="btn" onclick="copyCreditApp('${c.id}')">⧉ Copy</button><button class="btn" onclick="downloadCreditApp('${c.id}')">↓ Download</button></div><div id="creditAppPrintable" class="credit-print">${creditAppPrintHtml(c)}</div>`;document.getElementById('modalBackdrop').classList.add('show')}function copyCreditApp(id){const c=state.contacts.find(x=>x.id===id);if(!c)return;const txt=creditAppPlainText(c);const done=()=>toast('Credit application copied');const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Copy not supported')}document.body.removeChild(ta)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(fallback)}else{fallback()}}function downloadCreditApp(id){const c=state.contacts.find(x=>x.id===id);if(!c)return;const txt=creditAppPlainText(c);const blob=new Blob([txt],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='CreditApp_'+(displayName(c)||'customer').replace(/[^a-z0-9]+/gi,'_')+'.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Downloaded')}function printCreditAppWindow(id){const c=state.contacts.find(x=>x.id===id);if(!c)return;const w=window.open('','_blank');if(!w){toast('Popup blocked — use Copy or Download');return}w.document.write(`<html><head><title>Credit Application — ${esc(displayName(c))}</title><style>body{font-family:Arial,Helvetica,sans-serif;padding:32px;color:#111}h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;font-weight:600;margin:0 0 18px;color:#444}table{width:100%;border-collapse:collapse}td{padding:6px 8px;border-bottom:1px solid #ddd;font-size:13px;vertical-align:top}td.k{width:40%;color:#555;font-weight:600}</style></head><body>${creditAppPrintHtml(c)}<scr`+`ipt>window.onload=function(){window.print()}</scr`+`ipt></body></html>`);w.document.close()}function openLogSaleModal(contactId){const c=state.contacts.find(x=>x.id===contactId);if(!c)return;document.getElementById('modal').classList.add('wide');document.getElementById('modal').innerHTML=`<div class="modal-head"><div><div class="page-kicker">Auto Sale</div><div class="modal-title">Log Sale — ${esc(displayName(c))}</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveLoggedSale(event,'${c.id}')"><div class="form-grid"><div class="field full"><label>Vehicle Sold</label><input name="vehicle" required value="${esc(c.vehicle||'')}" placeholder="Year Make Model / stock #"></div><div class="field full"><label>Dealership Partner</label><select name="dealershipId" required><option value="">Select dealership...</option>${state.partners.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Sale Date</label><input name="saleDate" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Sale Amount</label><input name="saleAmount" type="number" min="0" step="0.01" placeholder="0.00" oninput="updateSaleProfitPreview(this.form)"></div><div class="field"><label>Vehicle Cost</label><input name="cost" type="number" min="0" step="0.01" placeholder="0.00" oninput="updateSaleProfitPreview(this.form)"></div><div class="field"><label>Gross Profit</label><input name="grossProfit" type="number" step="0.01" placeholder="0.00" oninput="updateSaleProfitPreview(this.form)"></div><div class="field"><label>Net Profit</label><input id="netProfitPreview" value="$0" readonly></div><div class="field"><label>Down Payment</label><input name="downPayment" type="number" min="0" step="0.01" value="${esc(c.creditApp?.downPayment||'')}"></div><div class="field full"><label>Notes</label><textarea name="notes" placeholder="Sale notes..."></textarea></div></div><div class="modal-actions"><button type="button" class="btn" onclick="openContactModal('${c.id}')">Cancel</button><button type="submit" class="btn btn-sale">💰 Log Sale</button></div></form>`;document.getElementById('modalBackdrop').classList.add('show')}
function updateSaleProfitPreview(form){const gross=Number(form?.elements?.grossProfit?.value||0),cost=Number(form?.elements?.cost?.value||0);const el=document.getElementById('netProfitPreview');if(el)el.value=money(gross-cost)}
function saveLoggedSale(e,contactId){e.preventDefault();const c=state.contacts.find(x=>x.id===contactId);if(!c)return;const fd=new FormData(e.target);const dealershipId=fd.get('dealershipId')||'';const partner=state.partners.find(p=>p.id===dealershipId);if(!partner){toast('Select the dealership for this sale');return}const sale={id:'sale_'+uid(),contactId,clientName:displayName(c),dealershipId,dealershipName:partner.name,vehicle:fd.get('vehicle')||c.vehicle||'',saleDate:fd.get('saleDate')||new Date().toISOString().slice(0,10),saleAmount:Number(fd.get('saleAmount')||0),cost:Number(fd.get('cost')||0),grossProfit:Number(fd.get('grossProfit')||0),netProfit:Number(fd.get('grossProfit')||0)-Number(fd.get('cost')||0),downPayment:Number(fd.get('downPayment')||0),notes:fd.get('notes')||'',createdAt:Date.now(),_updatedAt:Date.now()};state.sales.unshift(sale);c._updatedAt=Date.now();c.vehicle=sale.vehicle;c.stage='Sold';state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId,text:`Sale logged — ${sale.vehicle||'vehicle sold'}`,at:Date.now()});save();closeModal();render();toast('Sale logged')}
function money(n){return '$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0})}
function reportRange(mode){const now=new Date();const end=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59,999);let start;if(mode==='daily'){start=new Date(now.getFullYear(),now.getMonth(),now.getDate())}else if(mode==='weekly'){start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-6)}else if(mode==='yearly'){start=new Date(now.getFullYear(),0,1)}else if(mode==='all'){start=new Date(0)}else{start=new Date(now.getFullYear(),now.getMonth(),1)}return [start,end]}
function inRangeDate(value,start,end){const d=new Date(String(value).length===10?value+'T12:00:00':value);return d>=start&&d<=end}
function reportData(mode='monthly'){const [start,end]=reportRange(mode);const logged=state.sales.filter(s=>inRangeDate(s.saleDate,start,end));const loggedIds=new Set(state.sales.map(s=>s.contactId));const synth=state.contacts.filter(c=>c.stage==='Sold'&&!loggedIds.has(c.id)).map(c=>({id:'deal_'+c.id,contactId:c.id,clientName:displayName(c),dealershipId:'',dealershipName:'—',vehicle:c.vehicle||'',saleDate:new Date(c._updatedAt||c.createdAt||Date.now()).toISOString().slice(0,10),saleAmount:0,cost:0,grossProfit:0,netProfit:0,synthetic:true})).filter(s=>inRangeDate(s.saleDate,start,end));const sales=logged.concat(synth);const leads=state.contacts.filter(c=>{const d=new Date(c.createdAt||0);return d>=start&&d<=end});const sold=sales.length;return{sales,logged,leads,sold,closeRate:leads.length?Math.min(100,Math.round((sold/leads.length)*100)):(sold?100:0),totalSales:sales.reduce((a,s)=>a+Number(s.saleAmount||0),0),grossProfit:sales.reduce((a,s)=>a+Number(s.grossProfit||0),0),netProfit:sales.reduce((a,s)=>a+Number(s.netProfit!=null?s.netProfit:(Number(s.grossProfit||0)-Number(s.cost||0))),0),start,end}}
function reportBuckets(mode){const d=reportData(mode);const buckets=[];const now=new Date();const hourOf=s=>new Date(s.createdAt||(s.saleDate+'T12:00:00')).getHours();if(mode==='daily'){for(let h=8;h<=20;h+=2)buckets.push({label:(h>12?h-12:h)+(h>=12?'p':'a'),value:d.sales.filter(s=>hourOf(s)>=h&&hourOf(s)<h+2).length})}else if(mode==='weekly'){for(let i=6;i>=0;i--){const day=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);const key=day.toISOString().slice(0,10);buckets.push({label:day.toLocaleDateString(undefined,{weekday:'short'}),value:d.sales.filter(s=>String(s.saleDate)===key).length})}}else if(mode==='yearly'){for(let m=0;m<12;m++)buckets.push({label:new Date(2020,m,1).toLocaleString(undefined,{month:'short'}),value:d.sales.filter(s=>new Date(s.saleDate+'T12:00:00').getMonth()===m).length})}else if(mode==='all'){const years={};d.sales.forEach(s=>{const y=new Date(s.saleDate+'T12:00:00').getFullYear();years[y]=(years[y]||0)+1});const ys=Object.keys(years).sort();(ys.length?ys:[String(now.getFullYear())]).forEach(y=>buckets.push({label:String(y),value:years[y]||0}))}else{const days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();for(let day=1;day<=days;day+=3)buckets.push({label:String(day),value:d.sales.filter(s=>{const x=new Date(s.saleDate+'T12:00:00');return x.getDate()>=day&&x.getDate()<day+3}).length})}return buckets}

function openDealershipSales(id){const p=state.partners.find(x=>x.id===id);if(!p)return;const sales=state.sales.filter(s=>s.dealershipId===p.id||(!s.dealershipId&&s.dealershipName===p.name)).slice().sort((a,b)=>String(b.saleDate).localeCompare(String(a.saleDate)));const [ms,me]=reportRange('monthly');const monthSales=sales.filter(s=>inRangeDate(s.saleDate,ms,me));const total=sales.reduce((a,s)=>a+Number(s.saleAmount||0),0);const monthTotal=monthSales.reduce((a,s)=>a+Number(s.saleAmount||0),0);document.getElementById('modal').classList.add('wide');document.getElementById('modal').innerHTML=`<div class="modal-head"><div><div class="page-kicker">Dealership Invoice</div><div class="modal-title">${esc(p.name)} — Sales</div></div><button class="close" onclick="closeModal()">×</button></div><div class="report-kpis" style="margin-bottom:14px"><div class="report-kpi"><div class="report-kpi-label">This Month</div><div class="report-kpi-value">${money(monthTotal)}</div><div class="muted" style="font-size:12px">${monthSales.length} sale${monthSales.length===1?'':'s'}</div></div><div class="report-kpi"><div class="report-kpi-label">All Time</div><div class="report-kpi-value">${money(total)}</div><div class="muted" style="font-size:12px">${sales.length} sale${sales.length===1?'':'s'}</div></div></div>${sales.length?`<table class="report-table"><thead><tr><th>Date</th><th>Customer</th><th>Vehicle</th><th>Sale Amount</th></tr></thead><tbody>${sales.map(s=>`<tr><td>${esc(s.saleDate)}</td><td><strong>${esc(s.clientName||'')}</strong></td><td>${esc(s.vehicle||'')}</td><td>${money(s.saleAmount)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3" style="text-align:right"><strong>Total</strong></td><td><strong>${money(total)}</strong></td></tr></tfoot></table>`:`<div class="empty">No sales logged for this dealership yet.</div>`}<div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`;document.getElementById('modalBackdrop').classList.add('show')}function partnerStats(){const [ms,me]=reportRange('monthly');return state.partners.map(p=>{const sales=state.sales.filter(s=>s.dealershipId===p.id||(!s.dealershipId&&s.dealershipName===p.name));const monthSales=sales.filter(s=>inRangeDate(s.saleDate,ms,me));return{...p,sales,salesCount:sales.length,gross:sales.reduce((a,s)=>a+Number(s.grossProfit||0),0),net:sales.reduce((a,s)=>a+Number(s.netProfit!=null?s.netProfit:(Number(s.grossProfit||0)-Number(s.cost||0))),0),total:sales.reduce((a,s)=>a+Number(s.saleAmount||0),0),monthCount:monthSales.length,monthTotal:monthSales.reduce((a,s)=>a+Number(s.saleAmount||0),0)}}).sort((a,b)=>b.salesCount-a.salesCount||b.net-a.net)}
function carScoutLinks(){return (state.settings&&state.settings.carScoutLinks)||{}}
function saveCarScoutLink(key,v){state.settings=state.settings||{};state.settings.carScoutLinks=state.settings.carScoutLinks||{};state.settings.carScoutLinks[key]=String(v||'').trim();save()}

function renderCarScout(){const L=carScoutLinks();const leads=state.contacts.filter(c=>/^car scout|^website/i.test(String(c.source||''))).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,15);const linkBox=(key,label,hint)=>`<div class="panel" style="padding:16px 18px;margin-bottom:14px"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);font-weight:700;margin-bottom:4px">${label}</div><div class="muted" style="font-size:12px;margin-bottom:10px">${hint}</div><div style="display:flex;gap:8px"><input class="search" style="flex:1" value="${esc(L[key]||'')}" placeholder="Paste the ${esc(label)} URL" onblur="saveCarScoutLink('${key}',this.value)"><button class="btn btn-primary" onclick="saveCarScoutLink('${key}',this.previousElementSibling.value);copyCarScoutLink('${key}')">Copy Link</button></div></div>`;return `<div class="panel"><div class="panel-head"><div><div class="panel-title">Car Scout Form Links</div><div class="muted" style="font-size:12px;margin-top:4px">Paste each Car Scout form URL, then copy to text or email customers. When they submit, the lead lands here and in the pipeline as a New Lead \u2014 no typing required.</div></div></div>${linkBox('credit','Credit Application','Customers applying for auto financing.')}${linkBox('sell','Sell My Car','Customers who want to sell you their car.')}${linkBox('refinance','Auto Refinance','Customers who want to lower their payment.')}${linkBox('help','Find a Vehicle (Help)','Customers who want help finding a car.')}</div><div class="panel"><div class="panel-head"><div class="panel-title">Recent Car Scout Leads</div><div class="muted">${leads.length} shown</div></div>${leads.length?`<table class="report-table"><thead><tr><th>Customer</th><th>Phone / Email</th><th>Source</th><th>Received</th><th></th></tr></thead><tbody>${leads.map(c=>`<tr><td><strong>${esc(displayName(c))}</strong></td><td>${esc(c.phone||'')}${c.email?` \u00b7 ${esc(c.email)}`:''}</td><td>${esc(c.source||'Car Scout')}</td><td class="muted">${c.createdAt?new Date(c.createdAt).toLocaleDateString():'\u2014'}</td><td><button class="btn" onclick="openContactModal('${c.id}')">Open</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">No Car Scout leads yet. Share your form links above \u2014 submissions will appear here.</div>`}</div>`}
async function ingestInbound(){if(!cloudReady())return;try{const res=await supabaseClient.from('auto_inbound').select('id,type,payload,created_at').eq('processed',false).order('created_at',{ascending:true}).limit(100);if(res.error){console.warn('inbound',res.error.message||res.error);return}const rows=res.data||[];if(!rows.length)return;const done=[],names=[];let created=0;for(const row of rows){let nm=null;try{nm=ingestOne(String(row.type||''),row.payload||{})}catch(e){console.warn('ingestOne',e);nm=null}done.push(row.id);if(nm){created++;names.push(nm)}}if(done.length){const up=await supabaseClient.from('auto_inbound').update({processed:true}).in('id',done);if(up.error)console.warn('inbound mark',up.error.message||up.error)}if(created){save();render();notifyLeads(created,names)}}catch(e){console.warn('ingestInbound',e)}}
function ingestOne(type,payload){type=String(type||'').toLowerCase();if(type==='credit'){const ok=receiveWebsiteCreditApplication(payload);return ok?(([payload.firstName,payload.lastName].filter(Boolean).join(' ')||'New applicant')):null}if(type==='sell')return receiveSellLead(payload);if(type==='refinance'||type==='refi')return receiveRefiLead(payload);if(type==='help'||type==='contact')return receiveHelpLead(payload);return null}
function upsertLeadContact(payload,source,vehicle){let ph=String(payload.phone||payload.contact||'').trim(),em=String(payload.email||'').trim();if(!em&&/@/.test(ph)){em=ph;ph=''}if(!ph&&!em)return null;const resolved=resolveContactIdentity(ph,em,'');if(resolved.conflict){console.error('lead identity conflict');toast('Lead blocked: phone and email belong to different customers');return null}const now=Date.now();const name=String(payload.name||'').trim();const parts=name.split(/\s+/).filter(Boolean);let c=resolved.contact;if(c){if(!c.phone&&ph)c.phone=ph;if(!c.email&&em)c.email=em;if(vehicle&&!c.vehicle)c.vehicle=vehicle;if(!c.name&&name){c.name=name;c.firstName=c.firstName||parts[0]||'';c.lastName=c.lastName||parts.slice(1).join(' ')}c._updatedAt=now}else{c={id:uid(),firstName:parts[0]||'',lastName:parts.slice(1).join(' ')||'',name:name,phone:ph,email:em,address:'',vehicle:vehicle||'',stage:'New Lead',source:source,notes:'',creditApp:{},coSigner:null,documents:{},createdAt:now,_updatedAt:now};state.contacts.unshift(c)}return c}
function receiveSellLead(payload){const veh=[payload.year,payload.make,payload.model].filter(Boolean).join(' ');const c=upsertLeadContact(payload,'Car Scout \u2014 Sell My Car',veh);if(!c)return null;const now=Date.now();const t=`Sell My Car request: ${veh||'vehicle'}${payload.miles?`, ${payload.miles} mi`:''}${payload.condition?`, ${payload.condition}`:''}${payload.loan?`, loan: ${payload.loan}`:''}${payload.title?`, title: ${payload.title}`:''}`;state.activity.unshift({_updatedAt:now,id:uid(),contactId:c.id,text:t,at:now});return displayName(c)||'Sell My Car lead'}
function receiveRefiLead(payload){const c=upsertLeadContact(payload,'Car Scout \u2014 Auto Refinance','');if(!c)return null;const now=Date.now();const t=`Auto Refinance request${payload.balance?`: balance ${payload.balance}`:''}${payload.currentApr?`, current APR ${payload.currentApr}`:''}${payload.newApr?`, target APR ${payload.newApr}`:''}${payload.monthlySavings?`, est. savings ${payload.monthlySavings}/mo`:''}`;state.activity.unshift({_updatedAt:now,id:uid(),contactId:c.id,text:t,at:now});return displayName(c)||'Refinance lead'}
function receiveHelpLead(payload){const c=upsertLeadContact(payload,'Car Scout \u2014 Vehicle Search Help',String(payload.vehicle||payload.lookingFor||''));if(!c)return null;const now=Date.now();const t=`Vehicle search help${payload.lookingFor?`: ${payload.lookingFor}`:''}${payload.message?` \u2014 ${payload.message}`:''}`;state.activity.unshift({_updatedAt:now,id:uid(),contactId:c.id,text:t,at:now});return displayName(c)||'Vehicle search lead'}
function notifyLeads(n,names){const who=(names||[]).filter(Boolean).slice(0,3).join(', ');toast(`\ud83d\udd14 ${n} new Car Scout lead${n>1?'s':''}${who?': '+who:''}`)}

function openAddPartnerModal(){if(!isOwner()){toast('Only the owner can manage dealerships');return}document.getElementById('modal').classList.add('wide');document.getElementById('modal').innerHTML=`<div class="modal-head"><div><div class="page-kicker">Listed Partners</div><div class="modal-title">Add Dealership</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="savePartner(event)"><div class="form-grid"><div class="field full"><label>Dealership Name</label><input name="name" required></div><div class="field"><label>Contact Name</label><input name="contact"></div><div class="field"><label>Phone</label><input name="phone" type="tel"></div><div class="field full"><label>Email</label><input name="email" type="email"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Add Dealership</button></div></form>`;document.getElementById('modalBackdrop').classList.add('show')}
function savePartner(e){if(!isOwner()){e?.preventDefault?.();toast('Only the owner can manage dealerships');return}e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')||'').trim();if(!name)return;if(state.partners.some(p=>p.name.toLowerCase()===name.toLowerCase())){toast('That dealership is already listed');return}state.partners.push({id:'dealer_'+uid(),_updatedAt:Date.now(),name,contact:fd.get('contact')||'',phone:fd.get('phone')||'',email:fd.get('email')||'',createdAt:Date.now()});save();closeModal();render();toast('Dealership added')}

async function cloudArchivePartner(id){if(!cloudReady())return false;try{const result=await supabaseClient.from('auto_partners').upsert({id,data:{id},archived:true,updated_at:new Date().toISOString()});if(result.error)throw result.error;return true;}catch(e){console.error('partner archive failed',e);return false;}}async function deletePartner(id){if(!isOwner()){return toast('Only the owner can archive a dealership');}const p=state.partners.find(x=>x.id===id);if(!p)return;const linked=state.sales.filter(s=>s.dealershipId===id).length;if(linked){if(!confirm(`${p.name} has ${linked} logged sale${linked===1?'':'s'}. Archive it from the partner list anyway? Existing sales will keep the dealership name.`))return;}else{if(!confirm(`Archive ${p.name} from dealership partners?`))return;}if(cloudReady()){const archived=await cloudArchivePartner(id);if(!archived){toast('Archive failed. Dealership was not removed.');return;}}state.tombstones=state.tombstones||{};state.tombstones[id]=true;state.partners=state.partners.filter(x=>x.id!==id);save();const pane=document.getElementById('settingsPane');if(pane){pane.innerHTML=renderDealershipSettings();}toast('Dealership archived')}
function renderSettings(){return `<div class="settings-tabs"><button class="settings-tab active" onclick="showSettingsPane('reports',this)">📊 Reports</button><button class="settings-tab" onclick="showSettingsPane('dealerships',this)">🏢 Dealerships</button>${isOwner()?`<button class="settings-tab" onclick="showSettingsPane('team',this)">👥 Team & Roles</button>`:''}<button class="settings-tab" onclick="showSettingsPane('backup',this)">💾 Backup & Restore</button><button class="settings-tab" onclick="showSettingsPane('general',this)">⚙ General</button></div><div id="settingsPane">${renderReports('monthly')}</div>`}
function showSettingsPane(pane,btn){document.querySelectorAll('.settings-tab').forEach(b=>b.classList.remove('active'));btn?.classList.add('active');document.getElementById('settingsPane').innerHTML=pane==='reports'?renderReports('monthly'):pane==='dealerships'?renderDealershipSettings():pane==='team'?renderTeamSettings():pane==='backup'?renderBackupSettings():renderGeneralSettings()}
function renderBackupSettings(){return `<div class="panel"><div class="panel-head"><div><div class="panel-title">Backup & Restore</div><div class="muted" style="font-size:12px;margin-top:4px">Download a complete backup of this browser's PointIQOS Auto data before moving to cloud storage.</div></div></div><div class="form-grid"><div class="field full"><label>Backup Current Data</label><div class="inline-actions"><button class="btn btn-primary" type="button" onclick="downloadAutoBackup()">↓ Download Backup</button></div><div class="muted" style="font-size:11px;margin-top:7px">Includes contacts, activity, credit applications, sales, dealership partners, settings, and uploaded document data stored in this browser.</div></div><div class="field full"><label>Restore Backup</label><input id="restoreBackupFile" type="file" accept=".json,application/json"><div class="inline-actions" style="margin-top:8px"><button class="btn" type="button" onclick="restoreAutoBackup()">Restore Backup</button></div><div class="muted" style="font-size:11px;margin-top:7px">Restore replaces the current local Auto data after confirmation.</div></div></div></div>`}
function downloadAutoBackup(){try{const payload={app:'PointIQOS Auto',version:'5.2',storageKey:STORAGE_KEY,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pointiqos-auto-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded')}catch(e){console.error(e);toast('Backup failed')}}
function restoreAutoBackup(){const input=document.getElementById('restoreBackupFile');const file=input?.files?.[0];if(!file){toast('Choose a backup file first');return}const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const candidate=parsed&&parsed.state&&typeof parsed.state==='object'?parsed.state:parsed;const migrated=migrate(candidate);if(!migrated){toast('That backup file is not valid PointIQOS Auto data');return}if(!confirm('Restore this backup? This will replace the current local PointIQOS Auto data in this browser.'))return;state=migrated;save();render();toast('Backup restored')}catch(e){console.error(e);toast('Could not restore backup')}};reader.readAsText(file)}

function renderReports(mode='monthly'){const d=reportData(mode),b=reportBuckets(mode),mx=Math.max(1,...b.map(x=>x.value));return `<div class="report-filters"><div class="field"><label>Report Period</label><select id="reportMode"><option value="daily" ${mode==='daily'?'selected':''}>Daily</option><option value="weekly" ${mode==='weekly'?'selected':''}>Weekly</option><option value="monthly" ${mode==='monthly'?'selected':''}>Monthly</option><option value="yearly" ${mode==='yearly'?'selected':''}>Yearly</option><option value="all" ${mode==='all'?'selected':''}>All Time</option></select></div><button class="btn btn-primary" onclick="refreshReports()">🔍 Search</button><button class="btn" onclick="exportSalesCsv()">↓ Export CSV</button><button class="btn" onclick="window.print()">▣ Print</button></div><div class="report-kpis"><div class="report-kpi"><div class="report-kpi-label">Sales</div><div class="report-kpi-value">${d.sold}</div></div><div class="report-kpi"><div class="report-kpi-label">Leads</div><div class="report-kpi-value">${d.leads.length}</div></div><div class="report-kpi"><div class="report-kpi-label">Close Rate</div><div class="report-kpi-value">${d.closeRate}%</div></div><div class="report-kpi"><div class="report-kpi-label">Gross Profit</div><div class="report-kpi-value">${money(d.grossProfit)}</div></div><div class="report-kpi"><div class="report-kpi-label">Net Profit</div><div class="report-kpi-value">${money(d.netProfit)}</div></div></div><div class="report-chart"><div class="panel-title">Sales Performance</div><div class="chart-bars">${b.map(x=>`<div class="chart-col" title="${x.value} sale${x.value===1?'':'s'}"><div class="chart-bar" style="height:${Math.max(2,Math.round(x.value/mx*170))}px"></div><div class="chart-label">${esc(x.label)}</div></div>`).join('')}</div></div>${(function(){const g={};d.sales.forEach(s=>{const k=s.dealershipName||'—';if(!g[k])g[k]={count:0,amount:0,gross:0};g[k].count++;g[k].amount+=Number(s.saleAmount||0);g[k].gross+=Number(s.grossProfit||0)});const rows=Object.keys(g).sort((a,b)=>g[b].amount-g[a].amount);return `<div class="panel"><div class="panel-head"><div class="panel-title">Sales by Dealership</div></div>${rows.length?`<table class="report-table"><thead><tr><th>Dealership</th><th>Sales</th><th>Revenue</th><th>Gross Profit</th></tr></thead><tbody>${rows.map(k=>`<tr><td><strong>${esc(k)}</strong></td><td>${g[k].count}</td><td>${money(g[k].amount)}</td><td>${money(g[k].gross)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">No sales in this period.</div>`}</div>`})()}<div class="panel"><div class="panel-head"><div class="panel-title">Logged Sales</div></div>${d.sales.length?`<table class="report-table"><thead><tr><th>Date</th><th>Client</th><th>Dealership</th><th>Vehicle</th><th>Sale Amount</th><th>Vehicle Cost</th><th>Gross Profit</th><th>Net Profit</th><th>Down Payment</th></tr></thead><tbody>${d.sales.map(s=>`<tr><td>${esc(s.saleDate)}</td><td>${esc(s.clientName||'')}</td><td>${esc(s.dealershipName||'—')}</td><td>${esc(s.vehicle||'')}</td><td>${money(s.saleAmount)}</td><td>${money(s.cost)}</td><td>${money(s.grossProfit)}</td><td>${money(s.netProfit!=null?s.netProfit:(Number(s.grossProfit||0)-Number(s.cost||0)))}</td><td>${money(s.downPayment)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">No sales logged for this period.</div>`}</div>`}

function exportSalesCsv(){const rows=[['Date','Client','Dealership','Vehicle','Sale Amount','Vehicle Cost','Gross Profit','Net Profit','Down Payment'],...state.sales.map(s=>[s.saleDate,s.clientName,s.dealershipName||'',s.vehicle,s.saleAmount,s.cost||0,s.grossProfit,s.netProfit!=null?s.netProfit:(Number(s.grossProfit||0)-Number(s.cost||0)),s.downPayment])];const csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pointiqos-auto-sales.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function drow(ic,k,v){return `<div class="drow"><div class="drow-ic">${ic}</div><div class="drow-body"><div class="drow-k">${k}</div><div class="drow-v">${v}</div></div></div>`}function srow(k,v){return `<div class="srow"><span class="srow-k">${k}</span><span class="srow-v">${v}</span></div>`}function erow(ic,k,name,v){return `<div class="drow"><div class="drow-ic">${ic}</div><div class="drow-body"><div class="drow-k">${k}</div><input class="drow-input" name="${name}" value="${esc(v==null?'':v)}"></div></div>`}function esel(ic,k,name,v,opts){return `<div class="drow"><div class="drow-ic">${ic}</div><div class="drow-body"><div class="drow-k">${k}</div><select class="drow-input" name="${name}"><option value="">\u2014</option>${opts.map(o=>`<option ${String(v||'')===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div></div>`}function profilePaneHtml(c){const d=(c.creditApp&&Object.keys(c.creditApp).length)?c.creditApp:((state.creditApplications.find(x=>x.contactId===c.id)||{}).data||{});const shared={firstName:c.firstName||'',lastName:c.lastName||'',phone:c.phone||'',email:c.email||''};const form=CREDIT_FIELDS.map(([n,l,tp])=>fieldHtml(n,l,tp,((n in shared)?shared[n]:(d[n]||'')),false,'prof_',false)).join('');return `<div class="dcard-box"><div class="dcard-box-title">Customer Profile</div><div class="credit-grid" style="margin-top:6px">${form}</div></div>`}function wireCardSharedFields(){const pairs=[['ci_firstName','prof_firstName'],['ci_lastName','prof_lastName'],['ci_phone','prof_phone'],['ci_email','prof_email']];pairs.forEach(([aName,bName])=>{const a=document.querySelector('[name="'+aName+'"]');const b=document.querySelector('[name="'+bName+'"]');if(!a||!b)return;a.addEventListener('input',()=>{b.value=a.value});b.addEventListener('input',()=>{a.value=b.value})})}function saveCard(id){const c=state.contacts.find(x=>x.id===id);if(!c){toast('Contact not found');return}const modal=document.getElementById('modal');const gv=n=>{const el=modal.querySelector('[name="'+n+'"]');return el?String(el.value):undefined};const oldAddress=String(c.address||'');const oldCredit={...(c.creditApp||{})};const ci={firstName:gv('ci_firstName'),lastName:gv('ci_lastName'),phone:gv('ci_phone'),email:gv('ci_email'),address:gv('ci_address'),preferredContact:gv('ci_preferredContact'),bestTime:gv('ci_bestTime'),vehicle:gv('ci_vehicle'),bodyStyle:gv('ci_bodyStyle'),interestType:gv('ci_interestType'),condition:gv('ci_condition'),budget:gv('ci_budget'),tradeIn:gv('ci_tradeIn'),stage:gv('ci_stage')};const newPhone=(ci.phone!=null?ci.phone:(c.phone||''));const newEmail=(ci.email!=null?ci.email:(c.email||''));if((newPhone||newEmail)&&identityDuplicate(newPhone,newEmail,c.id)){toast('A customer with that phone or email already exists');return}const oldStage=c.stage;Object.keys(ci).forEach(k=>{if(ci[k]!==undefined)c[k]=ci[k]});c.name=[c.firstName,c.lastName].filter(Boolean).join(' ');const pf={};CREDIT_FIELDS.forEach(([n])=>{const v=gv('prof_'+n);if(v!==undefined)pf[n]=v});if(Object.keys(pf).length){c.creditApp={...(c.creditApp||{}),...pf};c.creditApp.firstName=c.firstName;c.creditApp.lastName=c.lastName;c.creditApp.phone=c.phone;c.creditApp.email=c.email;const app=state.creditApplications.filter(a=>a.contactId===c.id).sort((a,b)=>Number(b.submittedAt||0)-Number(a.submittedAt||0))[0]||null;if(app){app.data={...(app.data||{}),...c.creditApp};app._updatedAt=Date.now()}}const contactAddressChanged=ci.address!==undefined&&String(ci.address)!==oldAddress;const _paf=['currentStreet','currentCity','currentState','zip'];const profileAddressChanged=_paf.some(n=>String(pf[n]??'')!==String(oldCredit[n]??''));if(profileAddressChanged&&!contactAddressChanged){c.address=[pf.currentStreet,pf.currentCity,pf.currentState,pf.zip].filter(v=>String(v||'').trim()).join(', ')}const cs={};modal.querySelectorAll('[name^="cos_"]').forEach(el=>{cs[el.name.slice(4)]=el.value});const box=document.getElementById('coSignerBox');if(box){c.coSigner=box.dataset.removed==='1'?null:((!box.classList.contains('hidden')&&hasAny(cs))?cs:c.coSigner)}c._updatedAt=Date.now();state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:c.id,text:'Client updated',at:Date.now()});if(oldStage!==c.stage)state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:c.id,text:`Moved ${displayName(c)} to ${c.stage}`,at:Date.now()});save();render();openContactModal(id);toast('Saved')}function showClientPane(id,pane){const map={view:'clientDetailView',profile:'clientProfilePane',activity:'clientActivityPane',documents:'clientDocumentsPane'};Object.keys(map).forEach(k=>{const el=document.getElementById(map[k]);if(el)el.classList.toggle('hidden',k!==pane)});document.querySelectorAll('.dcard-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===pane))}

dium')+'</span>')}${drow('◉','Status','<span class="dchip dchip-open">'+esc(c.status||'Open')+'</span>')}${drow('▤','Date Entered',created.toLocaleDateString())}${drow('◷','Last Updated',updated.toLocaleDateString())}</div><div class="dcard-box"><div class="dcard-box-title">Quick Actions</div><div class="dcard-qa"><button type="button" class="qa-btn" onclick="${c.phone?`location.href='tel:${esc(c.phone)}'`:`toast('No phone number saved')`}">☎ Call</button><button type="button" class="qa-btn" onclick="${c.phone?`location.href='sms:${esc(c.phone)}'`:`toast('No phone number saved')`}">💬 Text</button><button type="button" class="qa-btn" onclick="${c.email?`location.href='mailto:${esc(c.email)}'`:`toast('No email saved')`}">✉ Email</button><button type="button" class="qa-btn" onclick="showClientPane('${c.id}','activity')">📅 Follow Up</button><button type="button" class="qa-btn" onclick="showClientPane('${c.id}','activity')">📝 Add Note</button><button type="button" class="qa-btn" onclick="showClientPane('${c.id}','activity')">🗓 Schedule</button></div></div><div class="dcard-box dcard-summary"><div class="dcard-box-title">★ Lead Summary</div>${srow('Lead Score',c.leadScore!=null?esc(c.leadScore):'—')}${srow('Engagement',c.engagement!=null?esc(c.engagement):'—')}${srow('Sales',saleCount)}${srow('Referrals',referralsCount)}${srow('Points Earned',pointsTotal)}</div></div></div><div class="dcard-foot"><span>Created: ${created.toLocaleString()}</span><span>ID: ${esc(c.id)}</span><span>Source: <span class="dcard-source">${src}</span></span><button type="button" class="dcard-del" onclick="deleteContact('${c.id}')">Delete client</button></div></div><div id="clientActivityPane" class="dcard-pane hidden"><div class="section"><div class="section-head"><div class="section-title">Activity</div><div class="inline-actions"><button type="button" class="btn" onclick="showCoSigner()">+ Add Co-Applicant</button></div></div>${activityHtml(c)}${coSignerHtml(c)}</div><div class="modal-actions"> function removeCoSigner(){const box=document.getElementById('coSignerBox');if(!box)return;box.querySelectorAll('input').forEach(i=>i.value='');box.classList.add('hidden');box.dataset.removed='1'}
function checkPhoneField(el,id){const err=document.getElementById('phoneError');const dup=phoneDuplicate(el.value,id);if(err)err.textContent=dup?'That phone number already belongs to another contact.':'';return !dup}
function collectPrefixed(fd,prefix){const out={};for(const [k,v] of fd.entries())if(k.startsWith(prefix))out[k.slice(prefix.length)]=v;return out}
function hasAny(obj){return Object.values(obj||{}).some(v=>String(v||'').trim())}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show');document.getElementById('modal').classList.remove('wide','xwide')}
function saveContact(e,id){e.preventDefault();var openId=id;const fd=new FormData(e.target);const phone=fd.has('phone')?(fd.get('phone')||''):(id?(state.contacts.find(x=>x.id===id)?.phone||''):'');const _em=fd.has('email')?(fd.get('email')||''):(id?(state.contacts.find(x=>x.id===id)?.email||''):'');if((phone||_em)&&identityDuplicate(phone,_em,id)){if(e.target.elements.phone){checkPhoneField(e.target.elements.phone,id);e.target.elements.phone.focus()}toast('A customer with that phone or email already exists');return}const existing=id?state.contacts.find(x=>x.id===id):null;const base={firstName:fd.has('firstName')?(fd.get('firstName')||''):(existing?.firstName||''),lastName:fd.has('lastName')?(fd.get('lastName')||''):(existing?.lastName||''),phone:fd.has('phone')?(fd.get('phone')||''):(existing?.phone||''),email:fd.has('email')?(fd.get('email')||''):(existing?.email||''),address:fd.has('address')?(fd.get('address')||''):(existing?.address||''),vehicle:fd.has('vehicle')?(fd.get('vehicle')||''):(existing?.vehicle||''),stage:fd.has('stage')?(fd.get('stage')||'New Lead'):(existing?.stage||'New Lead'),preferredContact:fd.has('preferredContact')?(fd.get('preferredContact')||''):(existing?.preferredContact||''),bestTime:fd.has('bestTime')?(fd.get('bestTime')||''):(existing?.bestTime||''),bodyStyle:fd.has('bodyStyle')?(fd.get('bodyStyle')||''):(existing?.bodyStyle||''),interestType:fd.has('interestType')?(fd.get('interestType')||''):(existing?.interestType||''),condition:fd.has('condition')?(fd.get('condition')||''):(existing?.condition||''),budget:fd.has('budget')?(fd.get('budget')||''):(existing?.budget||''),tradeIn:fd.has('tradeIn')?(fd.get('tradeIn')||''):(existing?.tradeIn||'')};base.name=[base.firstName,base.lastName].filter(Boolean).join(' ');if(id){const c=state.contacts.find(x=>x.id===id);const oldStage=c.stage;Object.assign(c,base);c._updatedAt=Date.now();const cs=collectPrefixed(fd,'cos_');const box=document.getElementById('coSignerBox');c.coSigner=box&&box.dataset.removed==='1'?null:(box&&!box.classList.contains('hidden')&&hasAny(cs)?cs:null);state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:id,text:'Client record updated',at:Date.now()});if(oldStage!==c.stage)state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:id,text:`Moved ${displayName(c)} to ${c.stage}`,at:Date.now()})}else{const idNew=uid();openId=idNew;state.contacts.unshift({id:idNew,...base,notes:'',creditApp:{},coSigner:null,documents:{},createdAt:Date.now(),_updatedAt:Date.now()});state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:idNew,text:'Contact created',at:Date.now()})}save();render();openContactModal(openId);toast(base.stage==='Dead'?'Saved. Contact is not in active pipeline.':'Client saved')}

function addActivity(id){const ta=document.getElementById('activityNote');const text=(ta?.value||'').trim();if(!text)return toast('Enter an activity note');state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:id,text,at:Date.now()});save();openContactModal(id,'activity');toast('Activity added')}
async function deleteContact(id){if(!isOwner()){return toast('Only the owner can archive a customer');}if(!confirm('Archive this customer? Only the owner can do this, and it removes them for everyone.'))return;const acts=state.activity.filter(a=>a.contactId===id).map(a=>a.id);const sals=(state.sales||[]).filter(s=>s.contactId===id).map(s=>s.id);const apps=(state.creditApplications||[]).filter(a=>a.contactId===id).map(a=>a.id);if(cloudReady()){const archived=await cloudArchiveMany(id,acts,sals,apps);if(!archived){toast('Archive failed. Customer was not removed.');return;}}state.tombstones=state.tombstones||{};state.tombstones[id]=true;[].concat(acts,sals,apps).forEach(function(x){state.tombstones[x]=true});state.contacts=state.contacts.filter(c=>c.id!==id);state.activity=state.activity.filter(a=>a.contactId!==id);state.sales=(state.sales||[]).filter(s=>s.contactId!==id);state.creditApplications=(state.creditApplications||[]).filter(a=>a.contactId!==id);save();closeModal();render();toast('Customer archived')}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.remove('show'),2200)}
window.addEventListener('focus',function(){pullCloud();ingestInbound()});document.addEventListener('visibilitychange',function(){if(!document.hidden){pullCloud();ingestInbound()}});setInterval(function(){ingestInbound()},60000);bootAuth();
</script>
