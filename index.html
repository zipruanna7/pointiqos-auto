function esc(v=''){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalizePhone(v=''){return String(v).replace(/\D/g,'')}
function findContactByIdentity(phone,email,excludeId){var np=normalizePhone(phone||''),ne=normalizeEmail(email||'');return state.contacts.find(function(c){return c.id!==excludeId&&((np&&normalizePhone(c.phone)===np)||(ne&&normalizeEmail(c.email)===ne))})||null}function identityDuplicate(phone,email,excludeId){return !!findContactByIdentity(phone,email,excludeId)}function resolveContactIdentity(phone,email,excludeId=''){const np=normalizePhone(phone||'');const ne=normalizeEmail(email||'');const phoneMatch=np?(state.contacts.find(c=>c.id!==excludeId&&normalizePhone(c.phone)===np)||null):null;const emailMatch=ne?(state.contacts.find(c=>c.id!==excludeId&&normalizeEmail(c.email)===ne)||null):null;if(phoneMatch&&emailMatch&&phoneMatch.id!==emailMatch.id){return{conflict:true,phoneMatch,emailMatch,contact:null}}return{conflict:false,phoneMatch,emailMatch,contact:phoneMatch||emailMatch||null}}function phoneDuplicate(phone,excludeId=''){const n=normalizePhone(phone);if(!n)return false;return state.contacts.some(c=>c.id!==excludeId&&normalizePhone(c.phone)===n)}
function activeContacts(){return state.contacts.filter(c=>c.stage!=='Dead')}
function displayName(c){return [c.firstName,c.lastName].filter(Boolean).join(' ').trim()||c.name||'Unnamed Contact'}
function fullAddress(c){return c.address||[c.creditApp?.currentStreet,c.creditApp?.currentCity,c.creditApp?.currentState,c.creditApp?.zip].filter(Boolean).join(', ')}
function setTab(tab){if(tab==='settings'&&!isOwner()){toast('Only the owner can access Settings');tab='dashboard'}currentTab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
function render(){const map={dashboard:['Dashboard','Auto sales command center'],contacts:['Contacts','Customer records and deal status'],creditApplications:['Credit Application','Incoming website credit applications'],submitDeal:['Submit Deal','Structure and submit a deal for a customer'],pipeline:['Pipeline','Move customers through the sales process'],partners:['Listed Partners','Dealership partners ranked by completed sales'],carscout:['Car Scout','Share your form links; website submissions arrive here as new leads'],settings:['Settings','Auto sales reporting and system settings']};document.getElementById('pageTitle').textContent=map[currentTab][0];document.getElementById('pageSub').textContent=map[currentTab][1];document.getElementById('content').innerHTML=currentTab==='dashboard'?renderDashboard():currentTab==='contacts'?renderContacts():currentTab==='creditApplications'?renderCreditApplications():currentTab==='submitDeal'?renderSubmitDeal():currentTab==='pipeline'?renderPipeline():currentTab==='partners'?renderPartners():currentTab==='carscout'?renderCarScout():renderSettings()}
function count(stage){return state.contacts.filter(c=>c.stage===stage).length}
function renderDashboard(){const active=activeContacts();return `<div class="stats"><div class="stat"><div class="stat-label">Active Leads</div><div class="stat-value">${active.filter(c=>c.stage!=='Sold').length}</div><div class="stat-note">Currently in pipeline</div></div><div class="stat"><div class="stat-label">Credit Apps Sent</div><div class="stat-value">${count('Credit App Sent')}</div><div class="stat-note">Waiting on completion</div></div><div class="stat"><div class="stat-label">Approved</div><div class="stat-value">${count('Approved')}</div><div class="stat-note">Ready for next step</div></div><div class="stat"><div class="stat-label">Sold</div><div class="stat-value">${count('Sold')}</div><div class="stat-note">Completed deals</div></div></div>${(function(){const rd=reportData('monthly');return `<div class="panel"><div class="panel-head"><div><div class="panel-title">This Month's Performance</div><div class="muted" style="font-size:12px;margin-top:4px">Logged sales this month</div></div></div><div class="stats" style="margin:0;grid-template-columns:repeat(4,minmax(0,1fr))"><div class="stat" style="padding:13px"><div class="stat-label">Sales</div><div class="stat-value" style="font-size:27px">${rd.sold}</div></div><div class="stat" style="padding:13px"><div class="stat-label">Revenue</div><div class="stat-value" style="font-size:27px">${money(rd.totalSales)}</div></div><div class="stat" style="padding:13px"><div class="stat-label">Gross Profit</div><div class="stat-value" style="font-size:27px">${money(rd.grossProfit)}</div></div><div class="stat" style="padding:13px"><div class="stat-label">Net Profit</div><div class="stat-value" style="font-size:27px">${money(rd.netProfit)}</div></div></div></div>`})()}<div class="panel"><div class="panel-head"><div><div class="panel-title">Pipeline Snapshot</div><div class="muted" style="font-size:12px;margin-top:4px">Current active customers by stage</div></div><button class="btn" onclick="setTab('pipeline')">Open Pipeline</button></div><div class="stats" style="margin:0;grid-template-columns:repeat(4,minmax(0,1fr))">${STAGES.slice(0,-1).map(s=>`<div class="stat" style="padding:13px"><div class="stat-label">${esc(s)}</div><div class="stat-value" style="font-size:27px">${count(s)}</div></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><div class="panel-title">Recent Contacts</div></div>${active.length?`<div class="activity-list">${active.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,6).map(c=>`<div class="activity"><div><strong>${esc(displayName(c))}</strong><br><span>${esc(c.vehicle||'No vehicle entered')}</span></div><span>${esc(c.stage)}</span></div>`).join('')}</div>`:`<div class="empty">No contacts yet.</div>`}</div>`}
function addedAgo(ts){const d=Math.max(0,Math.floor((Date.now()-ts)/86400000));if(d===0){const h=Math.max(0,Math.floor((Date.now()-ts)/3600000));return `Added ${h||1}h ago`}return `Added ${d}d ago`}
function renderContacts(){const cards=state.contacts.slice().sort((a,b)=>b.createdAt-a.createdAt).map(c=>`<div class="contact-card" onclick="openContactModal('${c.id}')"><div class="contact-name">${esc(displayName(c))}</div><div class="contact-row"><span class="contact-phone">${esc(c.phone||'No phone')}</span>${c.email?`<span class="contact-email">${esc(c.email)}</span>`:''}<span class="contact-added">${addedAgo(c.createdAt)}</span><div class="contact-actions"><button class="contact-action" onclick="event.stopPropagation();${c.phone?`location.href='tel:${esc(c.phone)}'`:`toast('No phone number saved')`}">☎ CALL</button><button class="contact-action" onclick="event.stopPropagation();openContactModal('${c.id}')">📝 NOTE</button></div></div>${fullAddress(c)?`<div class="contact-subline">${esc(fullAddress(c))}</div>`:''}</div>`).join('');return `<div class="toolbar"><input id="contactSearch" class="search" placeholder="Search contacts..." oninput="filterContacts(this.value)"><button class="btn btn-primary" onclick="openContactModal()">+ New Contact</button></div><div id="contactsGrid" class="contacts-grid">${cards||'<div class="empty">No contacts yet.</div>'}</div>`}
function filterContacts(q){q=q.toLowerCase();document.querySelectorAll('#contactsGrid .contact-card').forEach(card=>card.classList.toggle('hidden',!card.innerText.toLowerCase().includes(q)))}
function renderCreditApplications(){const apps=state.creditApplications.slice().sort((a,b)=>b.submittedAt-a.submittedAt);const newCount=apps.filter(a=>a.isNew).length;return `<div class="credit-intake-head"><div><div class="panel-title">Credit Applications</div><div class="page-sub">Applications submitted from your website will be managed here and tied to the client.</div></div><div class="credit-counts">${apps.length} Total · ${newCount} New</div></div><div class="portal-box"><div class="portal-label">Your Credit Application Website Link</div><div class="portal-row"><input id="portalUrlInput" class="portal-input" value="${esc(state.portalUrl||'')}" placeholder="Paste your credit application website URL here" onblur="savePortalUrl(this.value)"><button class="btn btn-primary" onclick="copyPortalUrl()">Copy Link</button></div></div><div class="intake-actions"><button class="btn btn-primary" onclick="openCreditApplicationModal()">+ Add Manually</button></div>${apps.length?`<div class="applications-list">${apps.map(a=>{const c=state.contacts.find(x=>x.id===a.contactId);const d=a.data||{};return `<div class="application-row" onclick="openApplicationRecord('${a.id}')"><div><div class="application-name">${esc(c?displayName(c):[d.firstName,d.lastName].filter(Boolean).join(' ')||'Unknown Applicant')}</div><div class="application-meta">${esc(d.phone||c?.phone||'')} ${d.email||c?.email?` · ${esc(d.email||c?.email)}`:''}</div></div><div><div class="application-name" style="font-size:12px">${esc(c?.vehicle||'No vehicle entered')}</div><div class="application-meta">${esc(a.source||'Website')}</div></div><div><div class="application-meta">${new Date(a.submittedAt).toLocaleString()}</div></div><div><span class="application-badge ${a.isNew?'new':''}">${a.isNew?'New':'Viewed'}</span></div></div>`}).join('')}</div>`:`<div class="empty-intake"><h3>No credit applications yet</h3><p>Applications submitted through your website will appear here. Each submission will create or link the client without creating a duplicate phone number, and the customer will enter the pipeline as a New Lead.</p></div>`}`}
function savePortalUrl(v){state.portalUrl=String(v||'').trim();save()}
async function copyPortalUrl(){const url=(document.getElementById('portalUrlInput')?.value||state.portalUrl||'').trim();if(!url)return toast('Add your credit application website URL first');state.portalUrl=url;save();try{await navigator.clipboard.writeText(url);toast('Credit application link copied')}catch(e){toast('Copy the link from the field')}}
function openCreditApplicationModal(appId=''){const app=appId?state.creditApplications.find(a=>a.id===appId):null;const d=app?.data||{};const c=app?state.contacts.find(x=>x.id===app.contactId):null;document.getElementById('modal').classList.add('xwide');document.getElementById('modal').innerHTML=`<div class="modal-head"><div><div class="page-kicker">${app?'Credit Application':'Manual Intake'}</div><div class="modal-title">${app?esc(c?displayName(c):'Credit Application'):'Add Credit Application'}</div></div><button class="close" onclick="closeModal()">×</button></div><form id="standaloneCreditForm" onsubmit="saveStandaloneCreditApplication(event,'${app?.id||''}')"><div class="credit-note">This application is managed from the Credit Application intake tab and tied to the client by phone number.</div><div class="credit-grid">${CREDIT_FIELDS.map(([n,l,t])=>fieldHtml(n,l,t,d[n]||'',true,'app_',true)).join('')}<div class="field full"><label>Vehicle of Interest</label><input name="app_vehicle" value="${esc(c?.vehicle||'')}" placeholder="Year Make Model / stock #"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">${app?'Save Application':'Create Application'}</button></div></form>`;document.getElementById('modalBackdrop').classList.add('show')}
function saveStandaloneCreditApplication(e,appId=''){e.preventDefault();const fd=new FormData(e.target);const data=collectPrefixed(fd,'app_');const vehicle=data.vehicle||'';delete data.vehicle;const phone=normalizePhone(data.phone);if(!phone){toast('Phone number is required');return}const resolved=resolveContactIdentity(data.phone,data.email,'');if(resolved.conflict){toast('Application blocked: phone and email belong to different customers');return}let existing=resolved.contact;if(appId){const app=state.creditApplications.find(a=>a.id===appId);if(!app)return;const linked=state.contacts.find(c=>c.id===app.contactId);if(!linked)return;const editIdentity=resolveContactIdentity(data.phone,data.email,linked.id);if(editIdentity.conflict||editIdentity.contact){toast('Application blocked: phone or email belongs to another customer');return}const c=linked;Object.assign(c,{firstName:data.firstName,lastName:data.lastName,name:[data.firstName,data.lastName].filter(Boolean).join(' '),phone:data.phone,email:data.email,address:[data.currentStreet,data.currentCity,data.currentState,data.zip].filter(Boolean).join(', '),vehicle:vehicle||c.vehicle,creditApp:{...data}});c._updatedAt=Date.now();app.data={...data};app.isNew=false;app._updatedAt=Date.now();state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:c.id,text:'Credit application updated',at:Date.now()});save();closeModal();render();toast('Credit application saved');return}let c=existing;if(c){c.firstName=c.firstName||data.firstName;c.lastName=c.lastName||data.lastName;c.name=[c.firstName,c.lastName].filter(Boolean).join(' ');c.email=c.email||data.email;c.address=c.address||[data.currentStreet,data.currentCity,data.currentState,data.zip].filter(Boolean).join(', ');c.vehicle=vehicle||c.vehicle;c.creditApp={...data};c._updatedAt=Date.now()}else{const idNew=uid();c={id:idNew,firstName:data.firstName,lastName:data.lastName,name:[data.firstName,data.lastName].filter(Boolean).join(' '),phone:data.phone,email:data.email,address:[data.currentStreet,data.currentCity,data.currentState,data.zip].filter(Boolean).join(', '),vehicle,stage:'New Lead',notes:'',creditApp:{...data},coSigner:null,createdAt:Date.now(),_updatedAt:Date.now()};state.contacts.unshift(c)}state.creditApplications.unshift({id:'app_'+uid(),contactId:c.id,submittedAt:Date.now(),_updatedAt:Date.now(),isNew:true,source:'Manual',data:{...data}});state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:c.id,text:'Credit application received',at:Date.now()});save();closeModal();render();toast(existing?'Application linked to existing client':'New credit application added')}
function openApplicationRecord(id){const app=state.creditApplications.find(a=>a.id===id);if(!app)return;if(app.isNew){app.isNew=false;app._updatedAt=Date.now();save();}openCreditApplicationModal(id)}
function receiveWebsiteCreditApplication(payload){if(!payload||typeof payload!=='object')return false;const incoming={};CREDIT_FIELDS.forEach(([n])=>{incoming[n]=String(payload[n]??'').trim()});const phone=normalizePhone(incoming.phone);const email=normalizeEmail(incoming.email);if(!phone&&!email)return false;const resolved=resolveContactIdentity(incoming.phone,incoming.email,'');if(resolved.conflict){console.error('Website application identity conflict',resolved.phoneMatch?.id,resolved.emailMatch?.id);toast('Application blocked: phone and email belong to different customers');return false}const now=Date.now();const mergeNonBlank=function(existing,newData){const out={...(existing||{})};CREDIT_FIELDS.forEach(([n])=>{const value=String(newData[n]??'').trim();if(value!=='')out[n]=value});return out};let c=resolved.contact;if(c){c.creditApp=mergeNonBlank(c.creditApp,incoming);if(incoming.firstName)c.firstName=incoming.firstName;if(incoming.lastName)c.lastName=incoming.lastName;c.name=[c.firstName,c.lastName].filter(Boolean).join(' ');if(incoming.phone)c.phone=incoming.phone;if(incoming.email)c.email=incoming.email;const addressParts=[incoming.currentStreet,incoming.currentCity,incoming.currentState,incoming.zip].filter(v=>String(v||'').trim());if(addressParts.length)c.address=addressParts.join(', ');if(payload.vehicle)c.vehicle=String(payload.vehicle);c._updatedAt=now}else{c={id:uid(),firstName:incoming.firstName,lastName:incoming.lastName,name:[incoming.firstName,incoming.lastName].filter(Boolean).join(' '),phone:incoming.phone,email:incoming.email,address:[incoming.currentStreet,incoming.currentCity,incoming.currentState,incoming.zip].filter(v=>String(v||'').trim()).join(', '),vehicle:String(payload.vehicle||''),stage:'New Lead',notes:'',creditApp:{...incoming},coSigner:null,documents:{},createdAt:now,_updatedAt:now};state.contacts.unshift(c)}let app=state.creditApplications.filter(a=>a.contactId===c.id&&String(a.source||'').toLowerCase()==='website').sort((a,b)=>Number(b.submittedAt||0)-Number(a.submittedAt||0))[0]||null;if(app){app.data=mergeNonBlank(app.data,incoming);app.isNew=true;app.submittedAt=now;app._updatedAt=now}else{state.creditApplications.unshift({id:'app_'+uid(),contactId:c.id,submittedAt:now,_updatedAt:now,isNew:true,source:'Website',data:{...incoming}})}state.activity.unshift({_updatedAt:now,id:uid(),contactId:c.id,text:'Website credit application received',at:now});save();render();return true}
window.PointIQOSAutoReceiveCreditApplication=receiveWebsiteCreditApplication;
function renderPipeline(){return `<div class="pipeline-wrap"><div class="pipeline">${STAGES.map(stage=>{const isDead=stage==='Dead';const cards=isDead?[]:state.contacts.filter(c=>c.stage===stage);return `<div class="column ${isDead?'dead-column':''}" data-stage="${esc(stage)}" ondragover="event.preventDefault()" ondrop="dropDeal(event,'${stage.replace(/'/g,"\\'")}')"><div class="column-head"><span>${esc(stage)}</span><span class="count">${isDead?count('Dead'):cards.length}</span></div>${isDead?`<div class="dead-help">Drop a customer here to remove the deal from the active pipeline. The contact record stays saved.</div>`:cards.map(c=>`<div class="deal-card" draggable="true" ondragstart="dragDeal(event,'${c.id}')" onclick="openContactModal('${c.id}')"><div class="deal-name">${esc(displayName(c))}</div><div class="deal-vehicle">${esc(c.vehicle||'No vehicle entered')}</div><div class="deal-phone">${esc(c.phone||'')}</div></div>`).join('')}</div>`}).join('')}</div></div>`}
function dragDeal(e,id){e.dataTransfer.setData('text/plain',id)}

function fieldHtml(name,label,type,value='',required=true,prefix='',showStar=required){const req=required?' required':'';const star=showStar?'<span class="required-star">*</span>':'';if(type.startsWith('select:')){const opts=type.slice(7).split('|');return `<div class="field"><label>${esc(label)}${star}</label><select name="${prefix}${name}"${req}><option value="">Select</option>${opts.map(o=>`<option value="${esc(o)}" ${String(value)===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}const step=type==='number'?' step="any" min="0"':'';const ac=name==='ssn'?' autocomplete="off" inputmode="numeric"':'';return `<div class="field"><label>${esc(label)}${star}</label><input name="${prefix}${name}" type="${type}" value="${esc(value)}"${req}${step}${ac}></div>`}
function creditFormHtml(c){const a=c?.creditApp||{};return `<div class="credit-note">Credit application is tied directly to this client record. All marked fields are required when saving the application.</div><div class="credit-grid">${CREDIT_FIELDS.map(([n,l,t])=>fieldHtml(n,l,t,a[n]??((n==='firstName'?c?.firstName:n==='lastName'?c?.lastName:n==='phone'?c?.phone:n==='email'?c?.email:'')||''),false,'credit_',true)).join('')}</div><div class="inline-actions" style="margin-top:14px"><button type="button" class="btn btn-primary" onclick="saveCreditApplication('${c.id}')">Save Credit Application</button></div>`}
function saveCreditApplication(id){const c=state.contacts.find(x=>x.id===id);if(!c){toast('Contact not found');return}const scope=document.getElementById('modal');const data={};CREDIT_FIELDS.forEach(([n])=>{const el=scope?.querySelector(`[name="credit_${n}"]`);data[n]=el?String(el.value):String(c.creditApp?.[n]||'')});const newPhone=String(data.phone||'').trim();const newEmail=String(data.email||'').trim();if((newPhone||newEmail)&&identityDuplicate(newPhone,newEmail,c.id)){toast('A customer with that phone or email already exists');return}if(data.firstName)c.firstName=data.firstName;if(data.lastName)c.lastName=data.lastName;c.name=[c.firstName,c.lastName].filter(Boolean).join(' ');if(newPhone)c.phone=data.phone;if(data.email)c.email=data.email;const addr=[data.currentStreet,data.currentCity,data.currentState,data.zip].filter(Boolean).join(', ');if(addr)c.address=addr;c.creditApp={...data};const app=state.creditApplications.find(a=>a.contactId===c.id);if(app){app.data={...data};app.isNew=false;app._updatedAt=Date.now();if(!app.submittedAt)app.submittedAt=Date.now()}else{state.creditApplications.unshift({id:'app_'+c.id,contactId:c.id,submittedAt:Date.now(),_updatedAt:Date.now(),isNew:false,source:'Existing Client',data:{...data}})}state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:c.id,text:app?'Credit application updated':'Credit application saved',at:Date.now()});c._updatedAt=Date.now();save();toast('Credit application saved')}
function documentUploadHtml(c){const docs=c.documents||{};const types=[['payStubs','Pay Stubs'],['id','Driver License / ID'],['insurance','Insurance Card'],['residency','Proof of Residency']];return `<div class="document-grid">${types.map(([key,label])=>{const d=docs[key];return `<div class="document-slot"><div class="document-slot-title">${label}</div>${d?`<div class="document-file">${esc(d.name)}</div><div class="inline-actions"><button type="button" class="btn" onclick="openClientDocument('${c.id}','${key}')">View</button><button type="button" class="btn btn-danger" onclick="removeClientDocument('${c.id}','${key}')">Remove</button></div>`:`<div class="document-file">No file uploaded</div>`}<input type="file" accept="image/*,.pdf" onchange="uploadClientDocument('${c.id}','${key}',this)"></div>`}).join('')}</div>`}
function activityHtml(c){const entries=state.activity.filter(a=>a.contactId===c.id).sort((a,b)=>b.at-a.at);return `<div class="field full"><label>Add Activity / Note</label><textarea id="activityNote" placeholder="Add a note, call result, appointment update..."></textarea></div><div class="inline-actions" style="margin-top:8px"><button type="button" class="btn" onclick="addActivity('${c.id}')">Add Activity</button></div><div class="activity-list" style="margin-top:14px">${entries.length?entries.map(a=>`<div class="activity-entry"><strong>${esc(a.text)}</strong><span>${new Date(a.at).toLocaleString()}</span></div>`).join(''):'<div class="muted" style="font-size:12px">No activity yet.</div>'}</div>`}
function coSignerHtml(c){const cs=c?.coSigner||{};return `<div class="co-signer-box ${c?.coSigner?'':'hidden'}" id="coSignerBox"><div class="section-head"><div class="section-title" style="font-size:17px">Co-Applicant</div><button type="button" class="btn btn-danger" onclick="removeCoSigner()">Remove</button></div><div class="form-grid"><div class="field"><label>First Name</label><input name="cos_firstName" value="${esc(cs.firstName||'')}"></div><div class="field"><label>Last Name</label><input name="cos_lastName" value="${esc(cs.lastName||'')}"></div><div class="field"><label>Phone</label><input name="cos_phone" type="tel" value="${esc(cs.phone||'')}"></div><div class="field"><label>Email</label><input name="cos_email" type="email" value="${esc(cs.email||'')}"></div><div class="field full"><label>Address</label><input name="cos_address" value="${esc(cs.address||'')}" placeholder="Street, City, State ZIP"></div></div></div>`}
function uploadClientDocument(contactId,type,input){const file=input.files&&input.files[0];if(!file)return;if(file.size>4*1024*1024){toast('File is too large. Maximum 4 MB.');input.value='';return}const reader=new FileReader();reader.onload=()=>{const c=state.contacts.find(x=>x.id===contactId);if(!c)return;c.documents=c.documents||{};c.documents[type]={name:file.name,type:file.type||'application/octet-stream',data:reader.result,uploadedAt:Date.now()};c._updatedAt=Date.now();state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId,text:`Uploaded ${file.name}`,at:Date.now()});save();openContactModal(contactId);toast('Document uploaded')};reader.readAsDataURL(file)}
function openClientDocument(contactId,type){const d=state.contacts.find(x=>x.id===contactId)?.documents?.[type];if(!d?.data)return toast('Document not found');const w=window.open();if(w)w.location=d.data;else toast('Allow pop-ups to view this document')}
function removeClientDocument(contactId,type){const c=state.contacts.find(x=>x.id===contactId);if(!c?.documents?.[type])return;const now=Date.now();delete c.documents[type];c._updatedAt=now;state.activity.unshift({id:uid(),contactId,text:'Document removed',at:now,_updatedAt:now});save();openContactModal(contactId);toast('Document removed')}

function sendContactToPipeline(id){const c=state.contacts.find(x=>x.id===id);if(!c)return;if(c.stage==='Dead'||c.stage==='Sold')c.stage='New Lead';state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:id,text:`Sent ${displayName(c)} to pipeline`,at:Date.now()});c._updatedAt=Date.now();save();closeModal();setTab('pipeline');toast('Sent to pipeline')}
function creditAppValue(c,n){const d=c.creditApp||{};if(n==='firstName')return c.firstName||d.firstName||'';if(n==='lastName')return c.lastName||d.lastName||'';if(n==='phone')return c.phone||d.phone||'';if(n==='email')return c.email||d.email||'';return d[n]||''}function creditAppPlainText(c){const lines=['CREDIT APPLICATION','Customer: '+displayName(c),''];CREDIT_FIELDS.forEach(([n,l])=>{lines.push(l+': '+(creditAppValue(c,n)||''))});return lines.join('\n')}function creditAppPrintHtml(c){const rows=CREDIT_FIELDS.map(([n,l])=>`<tr><td class="k">${esc(l)}</td><td class="v">${esc(creditAppValue(c,n)||'')}</td></tr>`).join('');return `<h1>Credit Application</h1><h2>${esc(displayName(c))}</h2><table>${rows}</table>`}function printCreditApp(id){const c=state.contacts.find(x=>x.id===id);if(!c)return;document.getElementById('modal').classList.add('wide');document.getElementById('modal').innerHTML=`<div class="modal-head"><div><div class="page-kicker">Credit Application</div><div class="modal-title">${esc(displayName(c))}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-actions" style="justify-content:flex-start;margin:0 0 12px"><button class="btn btn-primary" onclick="printCreditAppWindow('${c.id}')">🖨 Print / Save PDF</button><button class="btn" onclick="copyCreditApp('${c.id}')">⧉ Copy</button><button class="btn" onclick="downloadCreditApp('${c.id}')">↓ Download</button></div><div id="creditAppPrintable" class="credit-print">${creditAppPrintHtml(c)}</div>`;document.getElementById('modalBackdrop').classList.add('show')}function copyCreditApp(id){const c=state.contacts.find(x=>x.id===id);if(!c)return;const txt=creditAppPlainText(c);const done=()=>toast('Credit application copied');const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Copy not supported')}document.body.removeChild(ta)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(fallback)}else{fallback()}}function downloadCreditApp(id){const c=state.contacts.find(x=>x.id===id);if(!c)return;const txt=creditAppPlainText(c);const blob=new Blob([txt],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='CreditApp_'+(displayName(c)||'customer').replace(/[^a-z0-9]+/gi,'_')+'.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Downloaded')}function printCreditAppWindow(id){const c=state.contacts.find(x=>x.id===id);if(!c)return;const w=window.open('','_blank');if(!w){toast('Popup blocked — use Copy or Download');return}w.document.write(`<html><head><title>Credit Application — ${esc(displayName(c))}</title><style>body{font-family:Arial,Helvetica,sans-serif;padding:32px;color:#111}h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;font-weight:600;margin:0 0 18px;color:#444}table{width:100%;border-collapse:collapse}td{padding:6px 8px;border-bottom:1px solid #ddd;font-size:13px;vertical-align:top}td.k{width:40%;color:#555;font-weight:600}</style></head><body>${creditAppPrintHtml(c)}<scr`+`ipt>window.onload=function(){window.print()}</scr`+`ipt></body></html>`);w.document.close()}function openLogSaleModal(contactId){const c=state.contacts.find(x=>x.id===contactId);if(!c)return;document.getElementById('modal').classList.add('wide');document.getElementById('modal').innerHTML=`<div class="modal-head"><div><div class="page-kicker">Auto Sale</div><div class="modal-title">Log Sale — ${esc(displayName(c))}</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveLoggedSale(event,'${c.id}')"><div class="form-grid"><div class="field full"><label>Vehicle Sold</label><input name="vehicle" required value="${esc(c.vehicle||'')}" placeholder="Year Make Model / stock #"></div><div class="field full"><label>Dealership Partner</label><select name="dealershipId" required><option value="">Select dealership...</option>${state.partners.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Sale Date</label><input name="saleDate" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Sale Amount</label><input name="saleAmount" type="number" min="0" step="0.01" placeholder="0.00" oninput="updateSaleProfitPreview(this.form)"></div><div class="field"><label>Vehicle Cost</label><input name="cost" type="number" min="0" step="0.01" placeholder="0.00" oninput="updateSaleProfitPreview(this.form)"></div><div class="field"><label>Gross Profit</label><input name="grossProfit" type="number" step="0.01" placeholder="0.00" oninput="updateSaleProfitPreview(this.form)"></div><div class="field"><label>Net Profit</label><input id="netProfitPreview" value="$0" readonly></div><div class="field"><label>Down Payment<span class="required-star">*</span></label><input name="downPayment" type="number" min="0" step="0.01" required value="${customerDownPayment(c)!=null?customerDownPayment(c):''}"></div><div class="field"><label>Credit Tier<span class="required-star">*</span></label><select name="creditTier" required><option value="">Select tier...</option><option value="Subprime">Subprime</option><option value="Midprime">Midprime</option><option value="Prime">Prime</option></select></div><div class="field"><label>Credit Score<span class="required-star">*</span></label><input name="creditScore" type="number" min="300" max="900" required value="${customerCreditScore(c)!=null?customerCreditScore(c):''}" placeholder="300–900"></div><div class="field"><label>Commission (dealer owes)</label><input name="commission" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field full"><label>Notes</label><textarea name="notes" placeholder="Sale notes..."></textarea></div></div><div class="modal-actions"><button type="button" class="btn" onclick="openContactModal('${c.id}')">Cancel</button><button type="submit" class="btn btn-sale">💰 Log Sale</button></div></form>`;document.getElementById('modalBackdrop').classList.add('show')}
function updateSaleProfitPreview(form){const gross=Number(form?.elements?.grossProfit?.value||0),cost=Number(form?.elements?.cost?.value||0);const el=document.getElementById('netProfitPreview');if(el)el.value=money(gross-cost)}
function saveLoggedSale(e,contactId){e.preventDefault();const c=state.contacts.find(x=>x.id===contactId);if(!c)return;const fd=new FormData(e.target);const dealershipId=fd.get('dealershipId')||'';const partner=state.partners.find(p=>p.id===dealershipId);if(!partner){toast('Select the dealership for this sale');return}const creditTier=String(fd.get('creditTier')||'');if(!['Subprime','Midprime','Prime'].includes(creditTier)){toast('Select the credit tier for this sale');return}const dpRaw=fd.get('downPayment');if(dpRaw===null||String(dpRaw).trim()===''){toast('Enter the down payment for this sale');return}const scoreRaw=fd.get('creditScore');const creditScore=Number(scoreRaw);if(scoreRaw===null||String(scoreRaw).trim()===''||!(creditScore>=300&&creditScore<=900)){toast('Enter the customer\'s credit score (300–900)');return}const sale={id:'sale_'+uid(),contactId,clientName:displayName(c),dealershipId,dealershipName:partner.name,vehicle:fd.get('vehicle')||c.vehicle||'',saleDate:fd.get('saleDate')||new Date().toISOString().slice(0,10),saleAmount:Number(fd.get('saleAmount')||0),cost:Number(fd.get('cost')||0),grossProfit:Number(fd.get('grossProfit')||0),netProfit:Number(fd.get('grossProfit')||0)-Number(fd.get('cost')||0),downPayment:Number(fd.get('downPayment')||0),creditTier,creditScore,commission:Number(fd.get('commission')||0),notes:fd.get('notes')||'',createdAt:Date.now(),_updatedAt:Date.now()};state.sales.unshift(sale);c._updatedAt=Date.now();c.vehicle=sale.vehicle;c.stage='Sold';c.creditScore=creditScore;c.downPayment=sale.downPayment;state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId,text:`Sale logged — ${sale.vehicle||'vehicle sold'}`,at:Date.now()});save();closeModal();render();toast('Sale logged')}
function money(n){return '$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0})}
function reportRange(mode){const now=new Date();const end=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59,999);let start;if(mode==='daily'){start=new Date(now.getFullYear(),now.getMonth(),now.getDate())}else if(mode==='weekly'){start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-6)}else if(mode==='yearly'){start=new Date(now.getFullYear(),0,1)}else if(mode==='all'){start=new Date(0)}else{start=new Date(now.getFullYear(),now.getMonth(),1)}return [start,end]}
function inRangeDate(value,start,end){const d=new Date(String(value).length===10?value+'T12:00:00':value);return d>=start&&d<=end}
function reportData(mode='monthly'){const [start,end]=reportRange(mode);const logged=state.sales.filter(s=>inRangeDate(s.saleDate,start,end));const loggedIds=new Set(state.sales.map(s=>s.contactId));const synth=state.contacts.filter(c=>c.stage==='Sold'&&!loggedIds.has(c.id)).map(c=>({id:'deal_'+c.id,contactId:c.id,clientName:displayName(c),dealershipId:'',dealershipName:'—',vehicle:c.vehicle||'',saleDate:new Date(c._updatedAt||c.createdAt||Date.now()).toISOString().slice(0,10),saleAmount:0,cost:0,grossProfit:0,netProfit:0,synthetic:true})).filter(s=>inRangeDate(s.saleDate,start,end));const sales=logged.concat(synth);const leads=state.contacts.filter(c=>{const d=new Date(c.createdAt||0);return d>=start&&d<=end});const sold=sales.length;return{sales,logged,leads,sold,closeRate:leads.length?Math.round((leads.filter(c=>c.stage==='Sold').length/leads.length)*100):0,leadsSold:leads.filter(c=>c.stage==='Sold').length,totalSales:sales.reduce((a,s)=>a+Number(s.saleAmount||0),0),grossProfit:sales.reduce((a,s)=>a+Number(s.grossProfit||0),0),netProfit:sales.reduce((a,s)=>a+Number(s.netProfit!=null?s.netProfit:(Number(s.grossProfit||0)-Number(s.cost||0))),0),start,end}}
function reportBuckets(mode){const d=reportData(mode);const buckets=[];const now=new Date();const hourOf=s=>new Date(s.createdAt||(s.saleDate+'T12:00:00')).getHours();if(mode==='daily'){for(let h=8;h<=20;h+=2)buckets.push({label:(h>12?h-12:h)+(h>=12?'p':'a'),value:d.sales.filter(s=>hourOf(s)>=h&&hourOf(s)<h+2).length})}else if(mode==='weekly'){for(let i=6;i>=0;i--){const day=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);const key=day.toISOString().slice(0,10);buckets.push({label:day.toLocaleDateString(undefined,{weekday:'short'}),value:d.sales.filter(s=>String(s.saleDate)===key).length})}}else if(mode==='yearly'){for(let m=0;m<12;m++)buckets.push({label:new Date(2020,m,1).toLocaleString(undefined,{month:'short'}),value:d.sales.filter(s=>new Date(s.saleDate+'T12:00:00').getMonth()===m).length})}else if(mode==='all'){const years={};d.sales.forEach(s=>{const y=new Date(s.saleDate+'T12:00:00').getFullYear();years[y]=(years[y]||0)+1});const ys=Object.keys(years).sort();(ys.length?ys:[String(now.getFullYear())]).forEach(y=>buckets.push({label:String(y),value:years[y]||0}))}else{const days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();for(let day=1;day<=days;day+=3)buckets.push({label:String(day),value:d.sales.filter(s=>{const x=new Date(s.saleDate+'T12:00:00');return x.getDate()>=day&&x.getDate()<day+3}).length})}return buckets}

function openDealershipSales(id){const p=state.partners.find(x=>x.id===id);if(!p)return;const sales=state.sales.filter(s=>s.dealershipId===p.id||(!s.dealershipId&&s.dealershipName===p.name)).slice().sort((a,b)=>String(b.saleDate).localeCompare(String(a.saleDate)));const [ms,me]=reportRange('monthly');const monthSales=sales.filter(s=>inRangeDate(s.saleDate,ms,me));const total=sales.reduce((a,s)=>a+Number(s.saleAmount||0),0);const monthTotal=monthSales.reduce((a,s)=>a+Number(s.saleAmount||0),0);document.getElementById('modal').classList.add('wide');document.getElementById('modal').innerHTML=`<div class="modal-head"><div><div class="page-kicker">Dealership Invoice</div><div class="modal-title">${esc(p.name)} — Sales</div></div><button class="close" onclick="closeModal()">×</button></div><div class="report-kpis" style="margin-bottom:14px"><div class="report-kpi"><div class="report-kpi-label">This Month</div><div class="report-kpi-value">${money(monthTotal)}</div><div class="muted" style="font-size:12px">${monthSales.length} sale${monthSales.length===1?'':'s'}</div></div><div class="report-kpi"><div class="report-kpi-label">All Time</div><div class="report-kpi-value">${money(total)}</div><div class="muted" style="font-size:12px">${sales.length} sale${sales.length===1?'':'s'}</div></div></div>${sales.length?`<table class="report-table"><thead><tr><th>Date</th><th>Customer</th><th>Vehicle</th><th>Sale Amount</th></tr></thead><tbody>${sales.map(s=>`<tr><td>${esc(s.saleDate)}</td><td><strong>${esc(s.clientName||'')}</strong></td><td>${esc(s.vehicle||'')}</td><td>${money(s.saleAmount)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3" style="text-align:right"><strong>Total</strong></td><td><strong>${money(total)}</strong></td></tr></tfoot></table>`:`<div class="empty">No sales logged for this dealership yet.</div>`}<div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`;document.getElementById('modalBackdrop').classList.add('show')}function partnerStats(){const [ms,me]=reportRange('monthly');return state.partners.map(p=>{const sales=state.sales.filter(s=>s.dealershipId===p.id||(!s.dealershipId&&s.dealershipName===p.name));const monthSales=sales.filter(s=>inRangeDate(s.saleDate,ms,me));return{...p,sales,salesCount:sales.length,gross:sales.reduce((a,s)=>a+Number(s.grossProfit||0),0),net:sales.reduce((a,s)=>a+Number(s.netProfit!=null?s.netProfit:(Number(s.grossProfit||0)-Number(s.cost||0))),0),total:sales.reduce((a,s)=>a+Number(s.saleAmount||0),0),monthCount:monthSales.length,monthTotal:monthSales.reduce((a,s)=>a+Number(s.saleAmount||0),0)}}).sort((a,b)=>b.salesCount-a.salesCount||b.net-a.net)}
function carScoutLinks(){return (state.settings&&state.settings.carScoutLinks)||{}}
function saveCarScoutLink(key,v){state.settings=state.settings||{};state.settings.carScoutLinks=state.settings.carScoutLinks||{};state.settings.carScoutLinks[key]=String(v||'').trim();save()}

function renderCarScout(){const L=carScoutLinks();const leads=state.contacts.filter(c=>/^car scout|^website/i.test(String(c.source||''))).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,15);const linkBox=(key,label,hint)=>`<div class="panel" style="padding:16px 18px;margin-bottom:14px"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);font-weight:700;margin-bottom:4px">${label}</div><div class="muted" style="font-size:12px;margin-bottom:10px">${hint}</div><div style="display:flex;gap:8px"><input class="search" style="flex:1" value="${esc(L[key]||'')}" placeholder="Paste the ${esc(label)} URL" onblur="saveCarScoutLink('${key}',this.value)"><button class="btn btn-primary" onclick="saveCarScoutLink('${key}',this.previousElementSibling.value);copyCarScoutLink('${key}')">Copy Link</button></div></div>`;return `<div class="panel"><div class="panel-head"><div><div class="panel-title">Car Scout Form Links</div><div class="muted" style="font-size:12px;margin-top:4px">Paste each Car Scout form URL, then copy to text or email customers. When they submit, the lead lands here and in the pipeline as a New Lead \u2014 no typing required.</div></div></div>${linkBox('credit','Credit Application','Customers applying for auto financing.')}${linkBox('sell','Sell My Car','Customers who want to sell you their car.')}${linkBox('refinance','Auto Refinance','Customers who want to lower their payment.')}${linkBox('help','Find a Vehicle (Help)','Customers who want help finding a car.')}</div><div class="panel"><div class="panel-head"><div class="panel-title">Recent Car Scout Leads</div><div class="muted">${leads.length} shown</div></div>${leads.length?`<table class="report-table"><thead><tr><th>Customer</th><th>Phone / Email</th><th>Source</th><th>Received</th><th></th></tr></thead><tbody>${leads.map(c=>`<tr><td><strong>${esc(displayName(c))}</strong></td><td>${esc(c.phone||'')}${c.email?` \u00b7 ${esc(c.email)}`:''}</td><td>${esc(c.source||'Car Scout')}</td><td class="muted">${c.createdAt?new Date(c.createdAt).toLocaleDateString():'\u2014'}</td><td><button class="btn" onclick="openContactModal('${c.id}')">Open</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">No Car Scout leads yet. Share your form links above \u2014 submissions will appear here.</div>`}</div>`}
async function ingestInbound(){if(!cloudReady())return;try{const res=await supabaseClient.from('auto_inbound').select('id,type,payload,created_at').eq('processed',false).order('created_at',{ascending:true}).limit(100);if(res.error){console.warn('inbound',res.error.message||res.error);return}const rows=res.data||[];if(!rows.length)return;const done=[],names=[];let created=0;for(const row of rows){let nm=null;try{nm=ingestOne(String(row.type||''),row.payload||{})}catch(e){console.warn('ingestOne',e);nm=null}done.push(row.id);if(nm){created++;names.push(nm)}}if(done.length){const up=await supabaseClient.from('auto_inbound').update({processed:true}).in('id',done);if(up.error)console.warn('inbound mark',up.error.message||up.error)}if(created){save();render();notifyLeads(created,names)}}catch(e){console.warn('ingestInbound',e)}}
function ingestOne(type,payload){type=String(type||'').toLowerCase();if(type==='credit'){const ok=receiveWebsiteCreditApplication(payload);return ok?(([payload.firstName,payload.lastName].filter(Boolean).join(' ')||'New applicant')):null}if(type==='sell')return receiveSellLead(payload);if(type==='refinance'||type==='refi')return receiveRefiLead(payload);if(type==='help'||type==='contact')return receiveHelpLead(payload);return null}
function upsertLeadContact(payload,source,vehicle){let ph=String(payload.phone||payload.contact||'').trim(),em=String(payload.email||'').trim();if(!em&&/@/.test(ph)){em=ph;ph=''}if(!ph&&!em)return null;const resolved=resolveContactIdentity(ph,em,'');if(resolved.conflict){console.error('lead identity conflict');toast('Lead blocked: phone and email belong to different customers');return null}const now=Date.now();const name=String(payload.name||'').trim();const parts=name.split(/\s+/).filter(Boolean);let c=resolved.contact;if(c){if(!c.phone&&ph)c.phone=ph;if(!c.email&&em)c.email=em;if(vehicle&&!c.vehicle)c.vehicle=vehicle;if(!c.name&&name){c.name=name;c.firstName=c.firstName||parts[0]||'';c.lastName=c.lastName||parts.slice(1).join(' ')}c._updatedAt=now}else{c={id:uid(),firstName:parts[0]||'',lastName:parts.slice(1).join(' ')||'',name:name,phone:ph,email:em,address:'',vehicle:vehicle||'',stage:'New Lead',source:source,notes:'',creditApp:{},coSigner:null,documents:{},createdAt:now,_updatedAt:now};state.contacts.unshift(c)}return c}
function receiveSellLead(payload){const veh=[payload.year,payload.make,payload.model].filter(Boolean).join(' ');const c=upsertLeadContact(payload,'Car Scout \u2014 Sell My Car',veh);if(!c)return null;const now=Date.now();const t=`Sell My Car request: ${veh||'vehicle'}${payload.miles?`, ${payload.miles} mi`:''}${payload.condition?`, ${payload.condition}`:''}${payload.loan?`, loan: ${payload.loan}`:''}${payload.title?`, title: ${payload.title}`:''}`;state.activity.unshift({_updatedAt:now,id:uid(),contactId:c.id,text:t,at:now});return displayName(c)||'Sell My Car lead'}
function receiveRefiLead(payload){const c=upsertLeadContact(payload,'Car Scout \u2014 Auto Refinance','');if(!c)return null;const now=Date.now();const t=`Auto Refinance request${payload.balance?`: balance ${payload.balance}`:''}${payload.currentApr?`, current APR ${payload.currentApr}`:''}${payload.newApr?`, target APR ${payload.newApr}`:''}${payload.monthlySavings?`, est. savings ${payload.monthlySavings}/mo`:''}`;state.activity.unshift({_updatedAt:now,id:uid(),contactId:c.id,text:t,at:now});return displayName(c)||'Refinance lead'}
function receiveHelpLead(payload){const c=upsertLeadContact(payload,'Car Scout \u2014 Vehicle Search Help',String(payload.vehicle||payload.lookingFor||''));if(!c)return null;const now=Date.now();const t=`Vehicle search help${payload.lookingFor?`: ${payload.lookingFor}`:''}${payload.message?` \u2014 ${payload.message}`:''}`;state.activity.unshift({_updatedAt:now,id:uid(),contactId:c.id,text:t,at:now});return displayName(c)||'Vehicle search lead'}
function notifyLeads(n,names){const who=(names||[]).filter(Boolean).slice(0,3).join(', ');toast(`\ud83d\udd14 ${n} new Car Scout lead${n>1?'s':''}${who?': '+who:''}`)}
function renderPartners(){const rows=partnerStats();return `<div class="panel"><div class="panel-head"><div><div class="panel-title">Listed Partners</div><div class="muted" style="font-size:12px;margin-top:4px">Dealership partners ranked by completed sales.</div></div>${isOwner()?`<button class="btn btn-primary" onclick="openAddPartnerModal()">+ Add Dealership</button>`:''}</div>${rows.length?`<table class="report-table"><thead><tr><th>Rank</th><th>Dealership</th><th>Sales</th><th>This Month</th><th>Gross Profit</th><th>Net Profit</th><th></th></tr></thead><tbody>${rows.map((p,i)=>`<tr><td><strong>#${i+1}</strong></td><td><strong>${esc(p.name)}</strong>${p.contact?`<div class="muted">${esc(p.contact)}</div>`:''}</td><td>${p.salesCount}</td><td>${money(p.monthTotal)}</td><td>${money(p.gross)}</td><td>${money(p.net)}</td><td><button class="btn" onclick="openDealershipSales('${p.id}')">View Sales</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">No dealership partners added yet.</div>`}</div>`}
function openAddPartnerModal(){if(!isOwner()){toast('Only the owner can manage dealerships');return}document.getElementById('modal').classList.add('wide');document.getElementById('modal').innerHTML=`<div class="modal-head"><div><div class="page-kicker">Listed Partners</div><div class="modal-title">Add Dealership</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="savePartner(event)"><div class="form-grid"><div class="field full"><label>Dealership Name</label><input name="name" required></div><div class="field"><label>Contact Name</label><input name="contact"></div><div class="field"><label>Phone</label><input name="phone" type="tel"></div><div class="field full"><label>Email</label><input name="email" type="email"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Add Dealership</button></div></form>`;document.getElementById('modalBackdrop').classList.add('show')}
function savePartner(e){if(!isOwner()){e?.preventDefault?.();toast('Only the owner can manage dealerships');return}e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')||'').trim();if(!name)return;if(state.partners.some(p=>p.name.toLowerCase()===name.toLowerCase())){toast('That dealership is already listed');return}state.partners.push({id:'dealer_'+uid(),_updatedAt:Date.now(),name,contact:fd.get('contact')||'',phone:fd.get('phone')||'',email:fd.get('email')||'',createdAt:Date.now()});save();closeModal();render();toast('Dealership added')}
function renderDealershipSettings(){const rows=partnerStats();return `<div class="panel"><div class="panel-head"><div><div class="panel-title">Dealership Management</div><div class="muted" style="font-size:12px;margin-top:4px">Add partners from Listed Partners. Delete dealership records here in Settings.</div></div>${isOwner()?`<button class="btn btn-primary" onclick="openAddPartnerModal()">+ Add Dealership</button>`:''}</div>${rows.length?`<table class="report-table"><thead><tr><th>Dealership</th><th>Sales</th><th>This Month</th><th>Contact</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${p.salesCount}</td><td>${money(p.monthTotal)}</td><td>${esc(p.contact||p.phone||p.email||'—')}</td><td><button class="btn" onclick="openDealershipSales('${p.id}')">View Sales</button> <button class="btn btn-danger" onclick="deletePartner('${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">No dealership partners added yet.</div>`}</div>`}
async function cloudArchivePartner(id){if(!cloudReady())return false;try{const result=await supabaseClient.from('auto_partners').upsert({id,data:{id},archived:true,updated_at:new Date().toISOString()});if(result.error)throw result.error;return true;}catch(e){console.error('partner archive failed',e);return false;}}async function deletePartner(id){if(!isOwner()){return toast('Only the owner can archive a dealership');}const p=state.partners.find(x=>x.id===id);if(!p)return;const linked=state.sales.filter(s=>s.dealershipId===id).length;if(linked){if(!confirm(`${p.name} has ${linked} logged sale${linked===1?'':'s'}. Archive it from the partner list anyway? Existing sales will keep the dealership name.`))return;}else{if(!confirm(`Archive ${p.name} from dealership partners?`))return;}if(cloudReady()){const archived=await cloudArchivePartner(id);if(!archived){toast('Archive failed. Dealership was not removed.');return;}}state.tombstones=state.tombstones||{};state.tombstones[id]=true;state.partners=state.partners.filter(x=>x.id!==id);save();const pane=document.getElementById('settingsPane');if(pane){pane.innerHTML=renderDealershipSettings();}toast('Dealership archived')}
function moneyCents(n){return '$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function saleCommission(s){return Number(s&&s.commission!=null?s.commission:0)}
function dealerSales(p){return state.sales.filter(s=>s.dealershipId===p.id||(!s.dealershipId&&s.dealershipName===p.name))}
function invMonthKey(d){const x=new Date(String(d).length===10?d+'T12:00:00':d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
function invYearKey(d){return String(invMonthKey(d)).slice(0,4)}
function invPeriodLabel(key){key=String(key);if(key.length===4)return key;const parts=key.split('-');return new Date(Number(parts[0]),Number(parts[1])-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}
function groupSalesByMonth(sales){const g={};sales.forEach(s=>{const k=invMonthKey(s.saleDate);(g[k]=g[k]||[]).push(s)});return g}
function groupSalesByYear(sales){const g={};sales.forEach(s=>{const k=invYearKey(s.saleDate);(g[k]=g[k]||[]).push(s)});return g}
function invoiceDealers(){const list=state.partners.map(p=>({...p,archived:false}));const seenIds=new Set(list.map(p=>p.id));const seenNames=new Set(list.map(p=>String(p.name).toLowerCase()));state.sales.forEach(s=>{const nm=String(s.dealershipName||'').toLowerCase();if(s.dealershipId){if(!seenIds.has(s.dealershipId)){seenIds.add(s.dealershipId);if(nm)seenNames.add(nm);list.push({id:s.dealershipId,name:s.dealershipName||'Archived Dealership',contact:'',email:'',phone:'',archived:true})}}else if(nm&&!seenNames.has(nm)){seenNames.add(nm);list.push({id:'legacy_'+nm.replace(/[^a-z0-9]+/g,'_'),name:s.dealershipName,contact:'',email:'',phone:'',archived:true})}});return list}
function invoiceDealerById(id){return invoiceDealers().find(p=>p.id===id)||null}
function setSaleCommission(id,val){if(!isOwner()){toast('Only the owner can edit invoices');return}const s=state.sales.find(x=>x.id===id);if(!s)return;s.commission=Number(val||0);s._updatedAt=Date.now();save();const pane=document.getElementById('settingsPane');if(pane)pane.innerHTML=renderInvoices();toast('Commission updated')}
function renderInvoices(){const dealers=invoiceDealers();if(!dealers.length)return `<div class="panel"><div class="panel-head"><div class="panel-title">🧾 Invoices</div></div><div class="empty">Add a dealership under the Dealerships tab first — each dealer gets its own invoice section here.</div></div>`;const nowKey=invMonthKey(new Date().toISOString().slice(0,10));const yr=String(new Date().getFullYear());return dealers.map(p=>{const sales=dealerSales(p).slice().sort((a,b)=>String(b.saleDate).localeCompare(String(a.saleDate)));const byMonth=groupSalesByMonth(sales);const byYear=groupSalesByYear(sales);const monthKeys=Object.keys(byMonth).sort().reverse();const yearKeys=Object.keys(byYear).sort().reverse();const cur=byMonth[nowKey]||[];const curComm=cur.reduce((a,s)=>a+saleCommission(s),0);const curRev=cur.reduce((a,s)=>a+Number(s.saleAmount||0),0);const ytdComm=(byYear[yr]||[]).reduce((a,s)=>a+saleCommission(s),0);const allComm=sales.reduce((a,s)=>a+saleCommission(s),0);const badge=p.archived?`<span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle">Archived</span>`:'';const rowsFor=(keys,groups)=>keys.map(k=>{const arr=groups[k];const rev=arr.reduce((a,s)=>a+Number(s.saleAmount||0),0);const com=arr.reduce((a,s)=>a+saleCommission(s),0);return `<tr><td><strong>${esc(invPeriodLabel(k))}</strong></td><td>${arr.length}</td><td>${moneyCents(rev)}</td><td>${moneyCents(com)}</td><td><button class="btn" onclick="openDealerInvoice('${p.id}','${k}')">View</button> <button class="btn" onclick="printDealerInvoiceWindow('${p.id}','${k}')">Print</button></td></tr>`}).join('');return `<div class="panel"><div class="panel-head"><div><div class="panel-title">🧾 ${esc(p.name)}${badge}</div><div class="muted" style="font-size:12px;margin-top:4px">${p.archived?'Archived dealership — historical invoices preserved':esc(p.contact||p.email||p.phone||'Dealer commission invoices')}</div></div>${cur.length?`<button class="btn btn-primary" onclick="printDealerInvoiceWindow('${p.id}','${nowKey}')">🖨 Print / Send Invoice</button>`:''}</div><div class="report-kpis" style="margin-bottom:14px"><div class="report-kpi"><div class="report-kpi-label">Commission Owed — This Month</div><div class="report-kpi-value">${moneyCents(curComm)}</div><div class="muted" style="font-size:12px">${cur.length} sale${cur.length===1?'':'s'} · ${moneyCents(curRev)} revenue</div></div><div class="report-kpi"><div class="report-kpi-label">Commission YTD (${esc(yr)})</div><div class="report-kpi-value">${moneyCents(ytdComm)}</div></div><div class="report-kpi"><div class="report-kpi-label">Commission All Time</div><div class="report-kpi-value">${moneyCents(allComm)}</div></div></div><div class="panel-title" style="font-size:14px;margin-bottom:8px">Current Statement — ${esc(invPeriodLabel(nowKey))}</div>${cur.length?`<table class="report-table"><thead><tr><th>Date</th><th>Client</th><th>Vehicle</th><th>Sale Amount</th><th>Commission</th></tr></thead><tbody>${cur.map(s=>`<tr><td>${esc(s.saleDate)}</td><td><strong>${esc(s.clientName||'')}</strong></td><td>${esc(s.vehicle||'')}</td><td>${moneyCents(s.saleAmount)}</td><td><input class="drow-input" style="max-width:120px" type="number" min="0" step="0.01" value="${saleCommission(s)}" onchange="setSaleCommission('${s.id}',this.value)"></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4" style="text-align:right"><strong>Total Commission</strong></td><td><strong>${moneyCents(curComm)}</strong></td></tr></tfoot></table>`:`<div class="empty">No sales logged for ${esc(p.name)} this month.</div>`}${yearKeys.length?`<div class="panel-title" style="font-size:14px;margin:18px 0 8px">Yearly Invoices</div><table class="report-table"><thead><tr><th>Year</th><th>Deals</th><th>Revenue</th><th>Commission</th><th></th></tr></thead><tbody>${rowsFor(yearKeys,byYear)}</tbody></table>`:''}${monthKeys.length?`<div class="panel-title" style="font-size:14px;margin:18px 0 8px">Monthly Invoice History</div><table class="report-table"><thead><tr><th>Period</th><th>Deals</th><th>Revenue</th><th>Commission</th><th></th></tr></thead><tbody>${rowsFor(monthKeys,byMonth)}</tbody></table>`:''}</div>`}).join('')}
function dealerInvoiceData(id,key){const p=invoiceDealerById(id);if(!p)return null;key=String(key);const sales=dealerSales(p).filter(s=>key.length===4?invYearKey(s.saleDate)===key:invMonthKey(s.saleDate)===key).sort((a,b)=>String(a.saleDate).localeCompare(String(b.saleDate)));const revenue=sales.reduce((a,s)=>a+Number(s.saleAmount||0),0);const commission=sales.reduce((a,s)=>a+saleCommission(s),0);return {p,key,sales,revenue,commission}}
function dealerInvoicePrintHtml(inv){const p=inv.p,key=inv.key,sales=inv.sales,revenue=inv.revenue,commission=inv.commission;const dealer=(state.settings&&state.settings.dealerName)||'PointIQOS Auto';const kind=String(key).length===4?'Annual Commission Invoice':'Commission Invoice';const rows=sales.map(s=>`<tr><td>${esc(s.saleDate)}</td><td>${esc(s.clientName||'')}</td><td>${esc(s.vehicle||'')}</td><td class="num">${moneyCents(s.saleAmount)}</td><td class="num">${moneyCents(saleCommission(s))}</td></tr>`).join('');return `<div class="inv-doc"><div class="inv-top"><div><div class="inv-brand">${esc(dealer)}</div><div class="inv-sub">${kind}</div></div><div class="inv-meta"><div><span>Invoice Period</span>${esc(invPeriodLabel(key))}</div><div><span>Prepared</span>${new Date().toLocaleDateString()}</div></div></div><div class="inv-billto"><span>Bill To</span><div><strong>${esc(p.name)}</strong>${p.contact?`<br>${esc(p.contact)}`:''}${p.email?`<br>${esc(p.email)}`:''}${p.phone?`<br>${esc(p.phone)}`:''}</div></div>${sales.length?`<table class="inv-table"><thead><tr><th>Date</th><th>Client</th><th>Vehicle</th><th class="num">Sale Amount</th><th class="num">Commission</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="3" class="num"><strong>Totals</strong></td><td class="num"><strong>${moneyCents(revenue)}</strong></td><td class="num"><strong>${moneyCents(commission)}</strong></td></tr></tfoot></table><div class="inv-due"><span>Total Commission Due</span><div>${moneyCents(commission)}</div></div>`:`<div class="empty">No sales for this period.</div>`}</div>`}
function dealerInvoicePlainText(inv){const p=inv.p,key=inv.key,sales=inv.sales;const dealer=(state.settings&&state.settings.dealerName)||'PointIQOS Auto';const kind=String(key).length===4?'Annual Commission Invoice':'Commission Invoice';const L=[dealer+' — '+kind,'Dealer: '+p.name,'Period: '+invPeriodLabel(key),'Prepared: '+new Date().toLocaleDateString(),''];sales.forEach(s=>L.push([s.saleDate,s.clientName||'',s.vehicle||'','Sale '+moneyCents(s.saleAmount),'Commission '+moneyCents(saleCommission(s))].join('  ')));L.push('','Revenue: '+moneyCents(inv.revenue),'Total Commission Due: '+moneyCents(inv.commission));return L.join('\n')}
function openDealerInvoice(id,key){const inv=dealerInvoiceData(id,key);if(!inv)return;document.getElementById('modal').classList.add('wide');document.getElementById('modal').innerHTML=`<div class="modal-head"><div><div class="page-kicker">Dealer Invoice</div><div class="modal-title">${esc(inv.p.name)} — ${esc(invPeriodLabel(key))}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="modal-actions" style="justify-content:flex-start;margin:0 0 12px"><button class="btn btn-primary" onclick="printDealerInvoiceWindow('${id}','${key}')">🖨 Print / Send</button><button class="btn" onclick="copyDealerInvoice('${id}','${key}')">⧉ Copy</button></div>${dealerInvoicePrintHtml(inv)}<div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`;document.getElementById('modalBackdrop').classList.add('show')}
function copyDealerInvoice(id,key){const inv=dealerInvoiceData(id,key);if(!inv)return;const txt=dealerInvoicePlainText(inv);const done=()=>toast('Invoice copied');const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Copy not supported')}document.body.removeChild(ta)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(fallback)}else{fallback()}}
function printDealerInvoiceWindow(id,key){const inv=dealerInvoiceData(id,key);if(!inv)return;const w=window.open('','_blank');if(!w){toast('Popup blocked — use Copy or View');return}w.document.write(`<html><head><title>Invoice — ${esc(inv.p.name)} — ${esc(invPeriodLabel(key))}</title><style>body{font-family:Arial,Helvetica,sans-serif;padding:36px;color:#111}.inv-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:14px;margin-bottom:18px}.inv-brand{font-size:22px;font-weight:800}.inv-sub{color:#666;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}.inv-meta div{font-size:13px;text-align:right;margin-bottom:4px}.inv-meta span{color:#888;display:inline-block;min-width:110px}.inv-billto{margin-bottom:18px;font-size:13px}.inv-billto span{display:block;color:#888;text-transform:uppercase;font-size:11px;letter-spacing:.08em;margin-bottom:3px}table{width:100%;border-collapse:collapse;margin-bottom:16px}th,td{padding:8px 10px;border-bottom:1px solid #ddd;font-size:13px;text-align:left}th{color:#555;border-bottom:2px solid #bbb}.num{text-align:right}tfoot td{border-top:2px solid #111;border-bottom:none}.inv-due{display:flex;justify-content:space-between;align-items:center;background:#f4f5f7;padding:14px 18px;border-radius:8px}.inv-due span{text-transform:uppercase;font-size:11px;color:#666;letter-spacing:.08em}.inv-due div{font-size:22px;font-weight:800}.empty{color:#888;padding:20px 0}</style></head><body>${dealerInvoicePrintHtml(inv)}<scr`+`ipt>window.onload=function(){window.print()}</scr`+`ipt></body></html>`);w.document.close()}
function parseVehicleString(v){const m=String(v||'').trim().match(/^(\d{4})\s+(\S+)\s*(.*)$/);if(!m)return{year:'',make:'',model:''};return{year:m[1],make:m[2],model:m[3]||''}}
function dealPrefill(c){if(!c)return{};const ca=c.creditApp||{};const veh=parseVehicleString(c.vehicle);const housing=ca.rentOrHomeowner==='Homeowner'?'Own':(ca.rentOrHomeowner||'');return{firstName:c.firstName||'',lastName:c.lastName||'',ssn:ca.ssn||'',dob:ca.dob||'',address1:ca.currentStreet||c.address||'',city:ca.currentCity||'',state:ca.currentState||'',zip:ca.zip||'',mobile:c.phone||'',email:c.email||'',licenseNumber:ca.driversLicense||'',housingStatus:housing,yrsAtAddress:ca.yearsCurrentAddress||'',mosAtAddress:ca.monthsCurrentAddress||'',mortRent:ca.rentMortgageAmount||'',employer:ca.employerName||'',yrsAtEmployer:ca.yearsCurrentJob||'',mosAtEmployer:ca.monthsCurrentJob||'',businessPhone:ca.workNumber||'',occupation:ca.jobTitle||'',expectedSalary:ca.monthlyIncome||'',payFrequency:ca.monthlyIncome?'Monthly':'',vehicleYear:veh.year,vehicleMake:veh.make,vehicleModel:veh.model,cashDown:ca.downPayment||''}}
function openSubmitDeal(id){submitDealContactId=id||null;closeModal();setTab('submitDeal')}
function dealBack(){const id=submitDealContactId;if(id){setTab('contacts');openContactModal(id)}else{setTab('dashboard')}}
function dealNum(v){const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0}
function dealMonthlyIncome(d){const s=dealNum(d.expectedSalary);const f=String(d.payFrequency||'');let m=0;if(f==='Annually')m=s/12;else if(f==='Monthly')m=s;else if(f==='Semi-Monthly')m=s*2;else if(f==='Bi-Weekly')m=s*26/12;else if(f==='Weekly')m=s*52/12;return m+dealNum(d.otherIncome)}
function dealCalc(d){const unpaid=dealNum(d.cashSellingPrice)+dealNum(d.salesTax)+dealNum(d.tl)+dealNum(d.frontEndFees)-dealNum(d.cashDown)-dealNum(d.rebates);const financed=unpaid+dealNum(d.accidentHealth)+dealNum(d.creditLife)+dealNum(d.gap)+dealNum(d.vsc)+dealNum(d.backEndFees);const wholesale=dealNum(d.wholesaleValue);const ltv=wholesale>0?unpaid/wholesale*100:0;const inc=dealMonthlyIncome(d);const pti=inc>0?dealNum(d.estMonthlyPayment)/inc*100:0;return{unpaid,financed,ltv,pti}}
function collectDealForm(form){const fd=new FormData(form);const data=collectPrefixed(fd,'deal_');data.options=Array.from(form.querySelectorAll('input[name="deal_opt"]:checked')).map(x=>x.value);delete data.opt;data.emailNotProvided=!!form.querySelector('[name="deal_emailNotProvided"]')?.checked;data.permission=!!form.querySelector('[name="deal_permission"]')?.checked;data.privacyNotice=!!form.querySelector('[name="deal_privacyNotice"]')?.checked;data.paymentCall=fd.get('deal_paymentCall')||'No';data.tradeIn=fd.get('deal_tradeIn')||'No';return data}
function recalcDeal(){const form=document.getElementById('dealForm');if(!form)return;const d=collectDealForm(form);const r=dealCalc(d);const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};set('dealUnpaidTotal',moneyCents(r.unpaid));set('dealFinancedTotal',moneyCents(r.financed));set('dealLtv',r.ltv.toFixed(2)+'%');set('dealPti',r.pti.toFixed(2)+'%');const home=normalizePhone(d.home||''),mob=normalizePhone(d.mobile||'');const err=document.getElementById('dealPhoneError');if(err)err.textContent=(home&&mob&&home===mob)?'The same phone number cannot be used for Home and Mobile.':''}

function dealField(name,label,type,val,star){return fieldHtml(name,label,type,val==null?'':val,false,'deal_',!!star)}
function dealCalcRow(label,name,val,sign,star,extraId){return `<div class="deal-calc-row"><label>${esc(label)}${star?'<span class="required-star">*</span>':''}</label><div class="deal-calc-in"><input name="deal_${name}" type="number" step="0.01" min="0" placeholder="0.00" value="${esc(val==null?'':val)}"><span class="deal-sign">${sign||''}</span></div></div>`}

function printDealWindow(){const form=document.getElementById('dealForm');if(!form)return;const d=collectDealForm(form);const w=window.open('','_blank');if(!w){toast('Popup blocked — allow popups to print / save PDF');return}const nm=[d.firstName,d.lastName].filter(Boolean).join(' ')||'Applicant';w.document.write(`<html><head><title>Deal Submission — ${esc(nm)}</title><style>@page{size:letter;margin:.6in}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0;padding:24px;font-size:12px;line-height:1.4}.ds-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #111;padding-bottom:12px;margin-bottom:14px}.ds-brand{font-size:22px;font-weight:800;letter-spacing:-.01em}.ds-title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#666;margin-top:3px}.ds-meta div{text-align:right;font-size:12px;margin-bottom:3px}.ds-meta span{color:#888;display:inline-block;min-width:74px;text-align:left;margin-right:8px}.ds-summary{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}.ds-sum{border:1px solid #ddd;border-radius:6px;padding:8px 10px}.ds-sum span{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#777;margin-bottom:3px}.ds-sum strong{font-size:13.5px}.ds-sum.hi{background:#111;color:#fff;border-color:#111}.ds-sum.hi span{color:#bbb}.ds-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin-bottom:14px}section{break-inside:avoid}h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#333;margin:0 0 6px;border-bottom:2px solid #bbb;padding-bottom:4px}.kv-row{display:flex;justify-content:space-between;gap:12px;padding:3.5px 0;border-bottom:1px solid #eee;font-size:11.5px}.kv-row .k{color:#666;flex:0 0 42%}.kv-row .v{text-align:right;font-weight:600;word-break:break-word}.ds-fin-h{margin-top:6px}.ds-fin{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.fin-box{border:1px solid #ddd; function customerCreditScore(c){if(!c)return null;const v=(c.creditScore!=null&&c.creditScore!=='')?c.creditScore:(c.deal&&c.deal.creditScore!=null&&c.deal.creditScore!==''?c.deal.creditScore:null);if(v==null)return null;const n=Number(v);return isFinite(n)&&n>0?n:null}
function customerDownPayment(c,sale){if(sale&&sale.downPayment!=null&&sale.downPayment!==''){const n=Number(sale.downPayment);return isFinite(n)?n:null}if(!c)return null;const v=(c.downPayment!=null&&c.downPayment!=='')?c.downPayment:(c.deal&&c.deal.cashDown!=null&&c.deal.cashDown!==''?c.deal.cashDown:(c.creditApp&&c.creditApp.downPayment!=null&&c.creditApp.downPayment!==''?c.creditApp.downPayment:null));if(v==null)return null;const n=Number(v);return isFinite(n)?n:null}
function markLost(c,score,down){if(score!=null&&score!=='')c.creditScore=Number(score);if(down!=null&&down!=='')c.downPayment=Number(down);c.lostAt=Date.now();c._updatedAt=Date.now()}
function applyStageMove(c,stage){c.stage=stage;c._updatedAt=Date.now();state.activity.unshift({_updatedAt:Date.now(),id:uid(),contactId:c.id,text:`Moved ${displayName(c)} to ${stage}`,at:Date.now()});save();render();toast(stage==='Dead'?`${displayName(c)} removed from active pipeline`:`Moved to ${stage}`)}
function lostCancel(){const p=lostPending;lostPending=null;closeModal();if(p&&p.onCancel)p.onCancel()}
function recordLostOutcome(c,onDone,onCancel){const score=customerCreditScore(c);const down=customerDownPayment(c);lostPending={id:c.id,onDone,onCancel};document.getElementById('modal').classList.remove('wide');document.getElementById('modal').innerHTML=`<div class="modal-head"><div><div class="page-kicker">Lost / Declined</div><div class="modal-title">${esc(displayName(c))}</div></div><button class="close" onclick="lostCancel()">×</button></div><div class="muted" style="font-size:12.5px;margin-bottom:12px">Credit Score is required so this customer still counts in lead-quality reporting even though they didn't buy.</div><form id="lostForm" onsubmit="event.preventDefault();confirmLostOutcome('${c.id}')"><div class="form-grid"><div class="field"><label>Credit Score<span class="required-star">*</span></label><input name="creditScore" type="number" min="300" max="900" required value="${score!=null?score:''}" placeholder="300–900"></div><div class="field"><label>Down Payment</label><input name="downPayment" type="number" min="0" step="0.01" value="${down!=null?down:''}" placeholder="0.00"></div></div><div class="modal-actions"><button type="button" class="btn" onclick="lostCancel()">Cancel</button><button type="submit" class="btn btn-danger">Mark Lost / Declined</button></div></form>`;document.getElementById('modalBackdrop').classList.add('show');setTimeout(()=>document.querySelector('#lostForm [name="creditScore"]')?.focus(),0)}
function confirmLostOutcome(id){const p=lostPending;if(!p||p.id!==id)return;const form=document.getElementById('lostForm');if(!form)return;const score=Number(form.querySelector('[name="creditScore"]').value);if(!(score>=300&&score<=900)){toast('Enter a credit score between 300 and 900');return}const downRaw=form.querySelector('[name="downPayment"]').value;const c=state.contacts.find(x=>x.id===id);if(!c)return;lostPending=null;markLost(c,score,downRaw===''?0:downRaw);closeModal();p.onDone()}
function dropDeal(e,stage){e.preventDefault();const id=e.dataTransfer.getData('text/plain');const c=state.contacts.find(x=>x.id===id);if(!c)return;if(stage==='Dead'&&c.stage!=='Dead'){if(customerCreditScore(c)!=null){markLost(c,customerCreditScore(c),customerDownPayment(c));applyStageMove(c,stage)}else{recordLostOutcome(c,()=>applyStageMove(c,stage))}return}applyStageMove(c,stage)}
function renderSettings(){return `<div class="settings-tabs"><button class="settings-tab active" onclick="showSettingsPane('reports',this)">📊 Reports</button><button class="settings-tab" onclick="showSettingsPane('dealerships',this)">🏢 Dealerships</button><button class="settings-tab" onclick="showSettingsPane('invoices',this)">🧾 Invoices</button>${isOwner()?`<button class="settings-tab" onclick="showSettingsPane('team',this)">👥 Team & Roles</button>`:''}<button class="settings-tab" onclick="showSettingsPane('backup',this)">💾 Backup & Restore</button><button class="settings-tab" onclick="showSettingsPane('general',this)">⚙ General</button></div><div id="settingsPane">${renderReports('monthly')}</div>`}
function showSettingsPane(pane,btn){document.querySelectorAll('.settings-tab').forEach(b=>b.classList.remove('active'));btn?.classList.add('active');document.getElementById('settingsPane').innerHTML=pane==='reports'?renderReports('monthly'):pane==='dealerships'?renderDealershipSettings():pane==='invoices'?renderInvoices():pane==='team'?renderTeamSettings():pane==='backup'?renderBackupSettings():renderGeneralSettings()}
function renderBackupSettings(){return `<div class="panel"><div class="panel-head"><div><div class="panel-title">Backup & Restore</div><div class="muted" style="font-size:12px;margin-top:4px">Download a complete backup of this browser's PointIQOS Auto data before moving to cloud storage.</div></div></div><div class="form-grid"><div class="field full"><label>Backup Current Data</label><div class="inline-actions"><button class="btn btn-primary" type="button" onclick="downloadAutoBackup()">↓ Download Backup</button></div><div class="muted" style="font-size:11px;margin-top:7px">Includes contacts, activity, credit applications, sales, dealership partners, settings, and uploaded document data stored in this browser.</div></div><div class="field full"><label>Restore Backup</label><input id="restoreBackupFile" type="file" accept=".json,application/json"><div class="inline-actions" style="margin-top:8px"><button class="btn" type="button" onclick="restoreAutoBackup()">Restore Backup</button></div><div class="muted" style="font-size:11px;margin-top:7px">Restore replaces the current local Auto data after confirmation.</div></div></div></div>`}
function downloadAutoBackup(){try{const payload={app:'PointIQOS Auto',version:'5.9',storageKey:STORAGE_KEY,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pointiqos-auto-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded')}catch(e){console.error(e);toast('Backup failed')}}
function restoreAutoBackup(){const input=document.getElementById('restoreBackupFile');const file=input?.files?.[0];if(!file){toast('Choose a backup file first');return}const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const candidate=parsed&&parsed.state&&typeof parsed.state==='object'?parsed.state:parsed;const migrated=migrate(candidate);if(!migrated){toast('That backup file is not valid PointIQOS Auto data');return}if(!confirm('Restore this backup? This will replace the current local PointIQOS Auto data in this browser.'))return;state=migrated;save();render();toast('Backup restored')}catch(e){console.error(e);toast('Could not restore backup')}};reader.readAsText(file)}
